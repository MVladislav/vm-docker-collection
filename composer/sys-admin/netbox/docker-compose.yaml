---
x-basic-deploy-labels: &basic-deploy-labels
  labels:
    - traefik.enable=true
    - traefik.swarm.lbswarm=${LB_SWARM:-true}
    - traefik.swarm.network=proxy
    - traefik.http.routers.netbox.entrypoints=${TRAEFIK_ENTRYPOINT:-https}
    - traefik.http.routers.netbox.rule=Host(`${DOMAIN?domain variable not set}`)
    - traefik.http.routers.netbox.tls=true
    - traefik.http.routers.netbox.tls.certresolver=${CERT_RESOLVER:-}
    - traefik.http.routers.netbox.middlewares=${MIDDLEWARE_SECURED:-default-secured@file}
    - traefik.http.routers.netbox.service=netbox
    - traefik.http.services.netbox.loadbalancer.server.scheme=${PROTOCOL:-http}
    - traefik.http.services.netbox.loadbalancer.server.port=${PORT:-8080}

x-basic-deploy: &basic-deploy
  mode: replicated
  replicas: 1
  placement:
    max_replicas_per_node: 1
    constraints:
      - "node.role==${NODE_ROLE:-manager}"
      - node.platform.os == linux
  update_config:
    order: stop-first
  restart_policy:
    condition: any
  resources:
    limits:
      cpus: ${RESOURCES_LIMITS_CPUS:-1}
      memory: ${RESOURCES_LIMITS_MEMORY:-1g}
    reservations:
      cpus: ${RESOURCES_RESERVATIONS_CPUS:-0.001}
      memory: ${RESOURCES_RESERVATIONS_MEMORY:-32m}

x-basic: &basic
  env_file: ${ENV_FILE:-.env}
  cap_drop: ["ALL"]
  security_opt:
    - no-new-privileges:true
  ulimits:
    memlock:
      soft: -1
      hard: -1
    nofile:
      soft: 655360
      hard: 655360
    fsize: -1
    as: -1
  networks:
    default: {}
  healthcheck:
    disable: true
  tmpfs:
    - /tmp:rw,relatime,size=512m,nodev,nosuid,noexec
  restart: always

x-netbox:
  # https://hub.docker.com/r/netboxcommunity/netbox
  &netbox
  image: netboxcommunity/netbox:${VERSION:-v4.7.1}
  # uid 999, gid 0, chowns media/reports/scripts in the image
  user: "netbox:root"
  # netbox reads a fixed name from /run/secrets, not <VAR>_FILE
  secrets:
    - db_password
    - secret_key
    - api_token_pepper_1
    - superuser_password
  volumes:
    - /etc/timezone:/etc/timezone:ro
    - /etc/localtime:/etc/localtime:ro
    - netbox-media-files:/opt/netbox/netbox/media
    - netbox-reports-files:/opt/netbox/netbox/reports
    - netbox-scripts-files:/opt/netbox/netbox/scripts
  environment:
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-${DOMAIN?domain variable not set}}

    GRANIAN_PORT: ${PORT:-8080}
    GRANIAN_WORKERS: ${GRANIAN_WORKERS:-2}
    GRANIAN_BACKPRESSURE: ${GRANIAN_BACKPRESSURE:-32}

    CORS_ORIGIN_ALLOW_ALL: ${CORS_ORIGIN_ALLOW_ALL:-false}
    CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-true}
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-true}
    SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}

    DB_HOST: postgresql
    DB_NAME: ${DB_NAME:-netbox}
    DB_PORT: ${POSTGRES_PORT:-5432}
    DB_USER: ${DB_USER:-netbox}
    GRAPHQL_ENABLED: ${GRAPHQL_ENABLED:-true}
    MEDIA_ROOT: ${MEDIA_ROOT:-/opt/netbox/netbox/media}
    METRICS_ENABLED: ${METRICS_ENABLED:-false}
    WEBHOOKS_ENABLED: ${WEBHOOKS_ENABLED:-true}
    RQ_DEFAULT_TIMEOUT: ${RQ_DEFAULT_TIMEOUT:-300}
    WEBHOOK_DEFAULT_TIMEOUT: ${WEBHOOK_DEFAULT_TIMEOUT:-60}

    REDIS_CACHE_DATABASE: ${REDIS_CACHE_DATABASE:-1}
    REDIS_CACHE_HOST: valkey-cache
    REDIS_CACHE_INSECURE_SKIP_TLS_VERIFY: ${REDIS_CACHE_INSECURE_SKIP_TLS_VERIFY:-false}
    REDIS_CACHE_SSL: ${REDIS_CACHE_SSL:-false}
    REDIS_DATABASE: ${REDIS_DATABASE:-0}
    REDIS_HOST: valkey
    REDIS_INSECURE_SKIP_TLS_VERIFY: ${REDIS_INSECURE_SKIP_TLS_VERIFY:-false}
    REDIS_SSL: ${REDIS_SSL:-false}

    SKIP_SUPERUSER: ${SKIP_SUPERUSER:-false}
    SUPERUSER_EMAIL: ${SUPERUSER_EMAIL:-netbox@${DOMAIN?domain variable not set}}
    SUPERUSER_NAME: ${SUPERUSER_NAME:-admin}

    EMAIL_SERVER: ${EMAIL_SERVER:-localhost}
    EMAIL_PORT: ${EMAIL_PORT:-587}
    EMAIL_USERNAME: ${EMAIL_USERNAME:-netbox}
    EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
    EMAIL_FROM: ${EMAIL_FROM:-netbox@${DOMAIN?domain variable not set}}
    EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
    EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
    EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}

    CENSUS_REPORTING_ENABLED: ${CENSUS_REPORTING_ENABLED:-false}
    COPILOT_ENABLED: ${COPILOT_ENABLED:-false}
    RELEASE_CHECK_URL: ${RELEASE_CHECK_URL:-}

################################################################################
################################################################################
################################################################################

services:
  ##############################################################################
  ##############################################################################
  ##############################################################################
  netbox:
    <<:
      - *basic
      - *netbox
      # - *basic-deploy-labels
    deploy:
      <<:
        - *basic-deploy
        - *basic-deploy-labels
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_NETBOX:-1}
          memory: ${RESOURCES_LIMITS_MEMORY_NETBOX:-1g}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_NETBOX:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_NETBOX:-32m}
    networks:
      default: {}
      proxy: {}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -H 'X-Forwarded-Proto: https' http://localhost:${PORT:-8080}/login/ || exit 1",
        ]
      start_period: 300s
      interval: 30s
      timeout: 5s
      retries: 3

  netbox-worker:
    <<:
      - *basic
      - *netbox
      # - *basic-deploy-labels
    deploy:
      <<: *basic-deploy
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_NETBOX_WORKER:-1}
          memory: ${RESOURCES_LIMITS_MEMORY_NETBOX_WORKER:-1g}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_NETBOX_WORKER:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_NETBOX_WORKER:-32m}
    command:
      - /opt/netbox/venv/bin/python
      - /opt/netbox/netbox/manage.py
      - rqworker
    healthcheck:
      test: ["CMD-SHELL", "ps -aux | grep -v grep | grep -q rqworker || exit 1"]
      start_period: 300s
      interval: 30s
      timeout: 5s
      retries: 3

  ##############################################################################
  ##############################################################################
  ##############################################################################
  postgresql:
    # https://hub.docker.com/_/postgres
    image: postgres:${VERSION_POSTGRESQL:-18.6-alpine}
    <<: *basic
    deploy:
      <<: *basic-deploy
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_POSTGRESQL:-1}
          memory: ${RESOURCES_LIMITS_MEMORY_POSTGRESQL:-512m}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_POSTGRESQL:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_POSTGRESQL:-32m}
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_READ_SEARCH
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    secrets:
      - postgres_password_file
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netbox}
      POSTGRES_USER: ${POSTGRES_USER:-netbox}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password_file
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      PGDATA: /var/lib/postgresql/18/data
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - postgresql_v18:/var/lib/postgresql/18/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -d $${POSTGRES_DB} -U $${POSTGRES_USER}",
        ]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3

  ##############################################################################
  ##############################################################################
  ##############################################################################
  valkey:
    # https://hub.docker.com/r/valkey/valkey
    image: valkey/valkey:${VERSION_VALKEY:-9.1.2-alpine}
    <<: *basic
    deploy:
      <<: *basic-deploy
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_VALKEY:-1}
          memory: ${RESOURCES_LIMITS_MEMORY_VALKEY:-128m}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_VALKEY:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_VALKEY:-32m}
    user: "999:1000"
    environment:
      ALLOW_EMPTY_PASSWORD: ${ALLOW_EMPTY_PASSWORD:-true}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - valkey:/data
    command: --port 6379 --appendonly yes --save 300 1 --loglevel warning
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3

  valkey-cache:
    # https://hub.docker.com/r/valkey/valkey
    image: valkey/valkey:${VERSION_VALKEY:-9.1.2-alpine}
    <<: *basic
    deploy:
      <<: *basic-deploy
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_VALKEY_CACHE:-1}
          memory: ${RESOURCES_LIMITS_MEMORY_VALKEY_CACHE:-128m}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_VALKEY_CACHE:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_VALKEY_CACHE:-32m}
    user: "999:1000"
    environment:
      ALLOW_EMPTY_PASSWORD: ${ALLOW_EMPTY_PASSWORD:-true}
      # pure cache, no volatile keys to expire, stays under the 128m limit
      VALKEY_EXTRA_FLAGS: --maxmemory 96mb --maxmemory-policy allkeys-lru
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - valkey_cache:/data
    command: --port 6379 --loglevel warning
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3

################################################################################
################################################################################
################################################################################
networks:
  default:
    internal: true
    driver: ${NETWORK_MODE:-overlay}
    attachable: true
    driver_opts:
      encrypted: "true"
  proxy:
    external: true

volumes:
  netbox-media-files: {}
  netbox-reports-files: {}
  netbox-scripts-files: {}
  postgresql_v18: {}
  valkey: {}
  valkey_cache: {}

secrets:
  # one file, two names: postgres wants *_FILE, netbox looks up db_password
  postgres_password_file:
    file: config/secrets/postgres_password_file.txt
  db_password:
    file: config/secrets/postgres_password_file.txt
  secret_key:
    file: config/secrets/secret_key_file.txt
  api_token_pepper_1:
    file: config/secrets/api_token_pepper_1.txt
  superuser_password:
    file: config/secrets/superuser_password_file.txt
