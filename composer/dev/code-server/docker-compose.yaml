---
x-basic-deploy-labels: &basic-deploy-labels
  labels:
    - traefik.enable=true
    - traefik.swarm.lbswarm=${LB_SWARM:-true}
    - traefik.swarm.network=proxy
    - traefik.http.routers.code-server.entrypoints=${TRAEFIK_ENTRYPOINT:-https}
    - traefik.http.routers.code-server.rule=Host(`${DOMAIN?domain variable not set}`)
    - traefik.http.routers.code-server.tls=true
    - traefik.http.routers.code-server.tls.certresolver=${CERT_RESOLVER:-}
    - traefik.http.routers.code-server.middlewares=${MIDDLEWARE_SECURED:-default-secured@file}
    - traefik.http.routers.code-server.service=code-server
    - traefik.http.services.code-server.loadbalancer.server.scheme=${PROTOCOL:-http}
    - traefik.http.services.code-server.loadbalancer.server.port=${PORT:-8080}

x-basic-deploy: &basic-deploy
  mode: replicated
  replicas: 1
  placement:
    max_replicas_per_node: 1
    constraints:
      - "node.role==${NODE_ROLE:-manager}"
      - node.platform.os == linux
  update_config:
    order: stop-first
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 3
    window: 120s
  resources:
    limits:
      cpus: ${RESOURCES_LIMITS_CPUS:-4}
      memory: ${RESOURCES_LIMITS_MEMORY:-4g}
    reservations:
      cpus: ${RESOURCES_RESERVATIONS_CPUS:-0.001}
      memory: ${RESOURCES_RESERVATIONS_MEMORY:-32m}

x-basic: &basic
  env_file: ${ENV_FILE:-.env}
  # cap_add:
  #   # https://dockerlabs.collabnix.com/advanced/security/capabilities/
  #   - CHOWN # Allows changing file ownership (`chown`,`chgrp`)
  #   - FOWNER # Overrides file ownership checks (`chmod`,`kill`)
  #   - DAC_READ_SEARCH # Bypasses file read and directory execute permissions (`ls`,`cat`,`find`)
  #   - DAC_OVERRIDE # Bypasses file read/write/execute permission checks (`cat`,`touch`,`rm`)
  #   - SETGID # Allows setting group ID (`setgid`,`newgrp`,`chgrp`,`setregid()`)
  #   - SETUID # Allows setting user ID (`setuid`,`su`,`sudo`,`passwd`)
  #   - FSETID # Allows setting file SUID/SGID bits (`chmod u+s`,`chmod g+s`)
  cap_drop: ["ALL"]
  security_opt:
    - no-new-privileges:true
  ulimits:
    memlock:
      soft: -1
      hard: -1
    nofile:
      soft: 655360
      hard: 655360
    fsize: -1
    as: -1
  networks:
    proxy: {}
  healthcheck:
    disable: true
  tmpfs:
    - /tmp:rw,relatime,size=512m,nodev,nosuid,noexec
  restart: on-failure

################################################################################
################################################################################
################################################################################
services:
  ##############################################################################
  ##############################################################################
  ##############################################################################
  code-server:
    # https://hub.docker.com/r/codercom/code-server
    image: codercom/code-server:${VERSION:-4.141.0-ubuntu}
    <<:
      - *basic
      - *basic-deploy-labels
    deploy:
      <<:
        - *basic-deploy
        - *basic-deploy-labels
    environment:
      PASSWORD: ${PASSWORD:-}
      HASHED_PASSWORD: ${HASHED_PASSWORD:-}
      WORKSPACE: ${WORKSPACE:-/home/coder/projects}
      KEYBOARD_LAYOUT: ${KEYBOARD_LAYOUT:-de}
      CODE_SERVER_IDLE_TIMEOUT_SECONDS: ${IDLE_TIMEOUT_SECONDS:-}
    configs:
      # settings/keybindings are staged under /etc/code-server/provision and
      # copied into place by the ENTRYPOINTD script below. Mounting them
      # directly into ~/.local/share/code-server/User makes the daemon create
      # the (not yet existing) parent dirs root-owned, and code-server then dies
      - source: settings_config
        target: /etc/code-server/provision/settings.json
        mode: 0440
        uid: "1000"
        gid: "1000"
      - source: keybindings_config
        target: /etc/code-server/provision/keybindings.json
        mode: 0440
        uid: "1000"
        gid: "1000"
      # ENTRYPOINTD is baked as the literal /entrypoint.d, NOT
      # $HOME/entrypoint.d - the Dockerfile expands it at build time, when
      # $HOME is not set yet.
      # `mode` is honoured in swarm only; plain compose uses the host file mode,
      # so the script has to stay executable on the host (chmod 0755).
      - source: provision_user_data
        target: /entrypoint.d/50-provision-user-data.sh
        mode: 0555
        uid: "1000"
        gid: "1000"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - coder_home:/home/coder
      # - coder_local:/home/coder/.local
      # - coder_config:/home/coder/.config
    entrypoint: ["/usr/bin/entrypoint.sh"]
    command:
      - --bind-addr=0.0.0.0:8080
      - --disable-telemetry
      - --disable-update-check
      - --disable-getting-started-override
      - --enable-remote-storage
      - --disable-proxy
      - ${WORKSPACE:-/home/coder/projects}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/healthz > /dev/null 2>&1 || exit 1",
        ]
      start_period: 300s
      interval: 30s
      timeout: 5s
      retries: 3

################################################################################
################################################################################
################################################################################
networks:
  proxy:
    external: true

volumes:
  coder_home: {}
  # coder_local: {}
  # coder_config: {}

configs:
  settings_config:
    file: $PWD/config/settings.json
  keybindings_config:
    file: $PWD/config/keybindings.json
  provision_user_data:
    file: $PWD/config/entrypoint.d/50-provision-user-data.sh
