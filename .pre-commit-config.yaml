---
# Pre-commit configuration
# For details, visit: https://pre-commit.com/hooks.html

repos:
  # Codespell for spelling corrections
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args:
          - --ignore-words-list=ihs,ro,fo,discoverd,HSA
          - --skip="./.*,*.csv,*.json"
          - --quiet-level=2
        exclude_types:
          - csv
          - json

  # General pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      # - id: end-of-file-fixer
      - id: check-toml
      - id: check-json
        # code-server configs are JSONC (VS Code settings with comments)
        exclude: composer/dev/code-server/config/.*\.json
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Prettier for code formatting
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@3.9.6
          - prettier-plugin-sort-json@3.1.0
        exclude_types:
          - python
        # types_or:
        #   - yaml
        #   - json5

  # Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # YAML Linting
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint

  # Dockerfile linting
  # NOTE: ignores cover the existing Dockerfiles; remove ignores as the
  #       Dockerfiles get fixed to keep the guard tight
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        args:
          # WARN
          - "--ignore"
          - "DL3003" # Use WORKDIR to switch to a directory
          - "--ignore"
          - "DL3007"
          - "--ignore"
          - "DL3008"
          - "--ignore"
          - "DL3013"
          - "--ignore"
          - "DL3014"
          - "--ignore"
          - "DL3016"
          - "--ignore"
          - "DL3018"
          - "--ignore"
          - "DL3025"
          - "--ignore"
          - "DL3027"
          - "--ignore"
          - "DL3028"
          - "--ignore"
          - "DL3042"
          - "--ignore"
          - "DL3062"
          - "--ignore"
          - "DL4001"
          - "--ignore"
          - "DL4006"
          - "--ignore"
          - "SC1012"
          - "--ignore"
          - "SC2046"
          - "--ignore"
          - "SC2164"
          - "--ignore"
          - "SC2226"
          - "--ignore"
          - "SC3009"
          # INFO
          - "--ignore"
          - "SC2016" # Expressions don't expand in single quotes, use double quotes for that.
          - "--ignore"
          - "SC2028" # echo may not expand escape sequences. Use printf.
          - "--ignore"
          - "DL3009" # Delete the apt lists (/var/lib/apt/lists) after installing something
          - "--ignore"
          - "DL3015" # Avoid additional packages by specifying `--no-install-recommends`
          - "--ignore"
          - "DL3019" # Use the `--no-cache` switch to avoid the need to use `--update` and remove `/var/cache/apk/*` when done installing packages
          - "--ignore"
          - "DL3047" # Avoid use of wget without progress bar. Use `wget --progress=dot:giga <url>`. Or consider using `-q` or `-nv` (shorthands for `--quiet` or `--no-verbose`).
          - "--ignore"
          - "DL3059" # Multiple consecutive `RUN` instructions. Consider consolidation.
          - "--ignore"
          - "DL3060" # `yarn cache clean` missing after `yarn install` was run.
          - "--ignore"
          - "DL3066" # Non-numeric user-id may not be resolvable by host system
