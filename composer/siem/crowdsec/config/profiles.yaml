---
name: default_ip_remediation
# debug: true
filters:
  - Alert.Remediation == true && Alert.GetScope() == "Ip"
decisions:
  - type: ban
    duration: 4h
# duration_expr: Sprintf('%dh', (GetDecisionsCount(Alert.GetValue()) + 1) * 4)
notifications:
  #   - slack_default  # Set the webhook in /etc/crowdsec/notifications/slack.yaml before enabling this.
  #   - splunk_default # Set the splunk url and token in /etc/crowdsec/notifications/splunk.yaml before enabling this.
  # No search/index service runs in this stack, so the sink below never
  # resolves and every ban logs a failed POST. Enable it only together with
  # `ELASTIC_AUTH` in `.env` and a reachable opensearch on this network.
  #   - http_elasticsearch # Set the required http parameters in /etc/crowdsec/notifications/http.yaml before enabling this.
  - http_telegram # Set the required http parameters in /etc/crowdsec/notifications/telegram.yaml before enabling this.
#   - email_default  # Set the required email parameters in /etc/crowdsec/notifications/email.yaml before enabling this.
on_success: break
