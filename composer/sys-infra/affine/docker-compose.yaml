---
x-basic-deploy-labels: &basic-deploy-labels
  labels:
    - traefik.enable=true
    - traefik.swarm.lbswarm=${LB_SWARM:-true}
    - traefik.swarm.network=proxy
    - traefik.http.routers.affine.entrypoints=${TRAEFIK_ENTRYPOINT:-https}
    - traefik.http.routers.affine.rule=Host(`${DOMAIN?domain variable not set}`)
    - traefik.http.routers.affine.tls=true
    - traefik.http.routers.affine.tls.certresolver=${CERT_RESOLVER:-}
    - traefik.http.routers.affine.middlewares=${MIDDLEWARE_SECURED:-default-secured@file}
    - traefik.http.routers.affine.service=affine
    - traefik.http.services.affine.loadbalancer.server.scheme=${PROTOCOL:-http}
    - traefik.http.services.affine.loadbalancer.server.port=${PORT:-3010}

x-basic-deploy: &basic-deploy
  mode: replicated
  replicas: 1
  placement:
    max_replicas_per_node: 1
    constraints:
      - "node.role==${NODE_ROLE:-manager}"
      - node.platform.os == linux
  update_config:
    order: stop-first
  restart_policy:
    condition: any
  resources:
    limits:
      cpus: ${RESOURCES_LIMITS_CPUS:-2}
      memory: ${RESOURCES_LIMITS_MEMORY:-3g}
    reservations:
      cpus: ${RESOURCES_RESERVATIONS_CPUS:-0.001}
      memory: ${RESOURCES_RESERVATIONS_MEMORY:-32m}

x-basic: &basic
  env_file: ${ENV_FILE:-.env}
  cap_drop: ["ALL"]
  security_opt:
    - no-new-privileges:true
  ulimits:
    memlock:
      soft: -1
      hard: -1
    nofile:
      soft: 655360
      hard: 655360
    fsize: -1
    as: -1
  networks:
    default: {}
  healthcheck:
    disable: true
  tmpfs:
    - /tmp:rw,relatime,size=512m,nodev,nosuid,noexec
  restart: always

################################################################################
################################################################################
################################################################################
services:
  ##############################################################################
  ##############################################################################
  ##############################################################################
  affine:
    # https://github.com/toeverything/AFFiNE/pkgs/container/affine
    image: ghcr.io/toeverything/affine:${VERSION_AFFINE:-0.27.4}
    <<:
      - *basic
      - *basic-deploy-labels
    deploy:
      <<:
        - *basic-deploy
        - *basic-deploy-labels
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    environment:
      TZ: ${TIMEZONE:-Europe/Berlin}
      NODE_ENV: production
      AFFINE_SERVER_PORT: ${PORT:-3010}
      AFFINE_SERVER_HOST: ${DOMAIN?domain variable not set}
      AFFINE_SERVER_HTTPS: ${AFFINE_SERVER_HTTPS:-true}
      # AFFINE_SERVER_EXTERNAL_URL: ${AFFINE_SERVER_EXTERNAL_URL}

      REDIS_SERVER_HOST: valkey
      DATABASE_URL: postgresql://${POSTGRES_USER:-affine}:${POSTGRES_PW?POSTGRES_PW is not set}@postgresql:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-affine}

      AFFINE_INDEXER_ENABLED: ${AFFINE_INDEXER_ENABLED:-false}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - config:/root/.affine/config # private.key + optional config.json
      - storage:/root/.affine/storage # blob + avatar storage
    networks:
      default: {}
      proxy: {}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 3 bash -c '</dev/tcp/127.0.0.1/${PORT:-3010}' || exit 1",
        ]
      start_period: 60s
      interval: 30s
      timeout: 5s
      retries: 3

  ##############################################################################
  ##############################################################################
  ##############################################################################
  affine-migration:
    # https://github.com/toeverything/AFFiNE/blob/canary/packages/backend/server/scripts/self-host-predeploy.js
    image: ghcr.io/toeverything/affine:${VERSION_AFFINE:-0.27.4}
    <<: *basic
    deploy:
      <<: *basic-deploy
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_MIGRATION:-2}
          memory: ${RESOURCES_LIMITS_MEMORY_MIGRATION:-2g}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_MIGRATION:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_MIGRATION:-32m}
    restart: on-failure
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    environment:
      TZ: ${TIMEZONE:-Europe/Berlin}
      NODE_ENV: production
      REDIS_SERVER_HOST: valkey
      DATABASE_URL: postgresql://${POSTGRES_USER:-affine}:${POSTGRES_PW?POSTGRES_PW is not set}@postgresql:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-affine}
      AFFINE_INDEXER_ENABLED: "false"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - config:/root/.affine/config # shares private.key with `affine`
      - storage:/root/.affine/storage
    command: ["sh", "-c", "node ./scripts/self-host-predeploy.js"]

  ##############################################################################
  ##############################################################################
  ##############################################################################
  valkey:
    # https://hub.docker.com/r/valkey/valkey
    image: valkey/valkey:${VERSION_VALKEY:-9.1.2-alpine}
    <<: *basic
    deploy:
      <<: *basic-deploy
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_VALKEY:-1}
          memory: ${RESOURCES_LIMITS_MEMORY_VALKEY:-128m}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_VALKEY:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_VALKEY:-32m}
    cap_add:
      - SETUID
      - SETGID
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - valkey:/data
    command: --port 6379 --save 300 1 --loglevel warning
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3

  ##############################################################################
  ##############################################################################
  ##############################################################################
  postgresql:
    # https://hub.docker.com/_/postgres
    image: postgres:${VERSION_POSTGRESQL:-18.6-alpine}
    <<: *basic
    deploy:
      <<: *basic-deploy
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_POSTGRESQL:-1}
          memory: ${RESOURCES_LIMITS_MEMORY_POSTGRESQL:-512m}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_POSTGRESQL:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_POSTGRESQL:-32m}
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_READ_SEARCH
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    secrets:
      - postgres_password_file
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-affine}
      POSTGRES_USER: ${POSTGRES_USER:-affine}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password_file
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      PGDATA: /var/lib/postgresql/18/data
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - postgresql_v18:/var/lib/postgresql/18/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -d $${POSTGRES_DB} -U $${POSTGRES_USER}",
        ]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3

################################################################################
################################################################################
################################################################################
networks:
  default:
    internal: true
    driver: ${NETWORK_MODE:-overlay}
    attachable: true
    driver_opts:
      encrypted: "true"
  proxy:
    external: true

volumes:
  config: {}
  storage: {}
  valkey: {}
  postgresql_v18: {}

secrets:
  postgres_password_file:
    file: config/secrets/postgres_password_file.txt
