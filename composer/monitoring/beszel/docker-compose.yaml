---
x-basic-deploy-labels: &basic-deploy-labels
  labels:
    - traefik.enable=true
    - traefik.swarm.lbswarm=${LB_SWARM:-true}
    - traefik.swarm.network=proxy
    - traefik.http.routers.beszel.entrypoints=${TRAEFIK_ENTRYPOINT:-https}
    - traefik.http.routers.beszel.rule=Host(`${DOMAIN?domain variable not set}`)
    - traefik.http.routers.beszel.tls=true
    - traefik.http.routers.beszel.tls.certresolver=${CERT_RESOLVER:-}
    - traefik.http.routers.beszel.middlewares=${MIDDLEWARE_SECURED:-default-secured@file}
    - traefik.http.routers.beszel.service=beszel
    - traefik.http.services.beszel.loadbalancer.server.scheme=${PROTOCOL:-http}
    - traefik.http.services.beszel.loadbalancer.server.port=${PORT:-8090}

x-basic-deploy: &basic-deploy
  mode: replicated
  replicas: 1
  placement:
    max_replicas_per_node: 1
    constraints:
      - "node.role==${NODE_ROLE:-manager}"
      - node.platform.os == linux
  update_config:
    order: stop-first
  restart_policy:
    condition: any
  resources:
    limits:
      cpus: ${RESOURCES_LIMITS_CPUS:-1}
      memory: ${RESOURCES_LIMITS_MEMORY:-1g}
    reservations:
      cpus: ${RESOURCES_RESERVATIONS_CPUS:-0.001}
      memory: ${RESOURCES_RESERVATIONS_MEMORY:-32m}

x-basic: &basic
  env_file: ${ENV_FILE:-.env}
  cap_drop: ["ALL"]
  security_opt:
    - no-new-privileges:true
  ulimits:
    memlock:
      soft: -1
      hard: -1
    nofile:
      soft: 655360
      hard: 655360
    fsize: -1
    as: -1
  networks:
    default: {}
  healthcheck:
    disable: true
  restart: always

################################################################################
################################################################################
################################################################################
services:
  ##############################################################################
  ##############################################################################
  ##############################################################################
  beszel:
    # https://github.com/henrygd/beszel/pkgs/container/beszel%2Fbeszel
    image: ghcr.io/henrygd/beszel/beszel:${VERSION:-0.21.0}
    <<:
      - *basic
      # - *basic-deploy-labels
    deploy:
      <<:
        - *basic-deploy
        - *basic-deploy-labels
    environment:
      APP_URL: https://${DOMAIN?domain variable not set}

      # HEARTBEAT_URL: ${HEARTBEAT_URL:-}
      # HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-60}
      # HEARTBEAT_METHOD: ${HEARTBEAT_METHOD:-POST}

      # USER_EMAIL: ${USER_EMAIL:-groot@${DOMAIN?domain variable not set}}
      # USER_PASSWORD: ${USER_PASSWORD:-groot}

      MFA_OTP: ${MFA_OTP:-false}
      SHARE_ALL_SYSTEMS: ${SHARE_ALL_SYSTEMS:-false}
      DISABLE_PASSWORD_AUTH: ${DISABLE_PASSWORD_AUTH:-false}
      USER_CREATION: ${USER_CREATION:-false}

      CHECK_UPDATES: ${CHECK_UPDATES:-false}
      CONTAINER_DETAILS: ${CONTAINER_DETAILS:-true}
      # SYNC_SYSTEM_NAMES: ${SYNC_SYSTEM_NAMES:-false} # sync display names with agent hostnames (0.21+)
      # CSP: ${CSP:-}
      # OAUTH_DISABLE_POPUP: ${OAUTH_DISABLE_POPUP:-false}
      # TRUSTED_AUTH_HEADER: ${TRUSTED_AUTH_HEADER:-}
      # TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - data:/beszel_data
      - socket:/beszel_socket
    networks:
      default: {}
      proxy: {}
    healthcheck:
      test:
        [
          "CMD",
          "/beszel",
          "health",
          "--url",
          "${PROTOCOL:-http}://127.0.0.1:${PORT:-8090}",
        ]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3

  ##############################################################################
  ##############################################################################
  ##############################################################################
  beszel-agent:
    # https://github.com/henrygd/beszel/pkgs/container/beszel%2Fbeszel-agent
    image: ghcr.io/henrygd/beszel/beszel-agent:${VERSION_AGENT:-0.21.0}
    # image: ghcr.io/henrygd/beszel/beszel-agent-nvidia:${VERSION_AGENT:-0.21.0}
    # image: ghcr.io/henrygd/beszel/beszel-agent-intel:${VERSION_AGENT:-0.21.0}
    <<: *basic
    deploy:
      <<: *basic-deploy
    cap_add:
      - NET_RAW
      - SYS_RAWIO # Required for S.M.A.R.T. data
      - SYS_ADMIN # Required for NVMe S.M.A.R.T. data
    environment:
      # HUB_URL: ""
      LISTEN: /beszel_socket/beszel.sock
      KEY: ${KEY?KEY for agent is not set}

      ### optional monitoring coverage ###
      # EXTRA_FILESYSTEMS: ${EXTRA_FILESYSTEMS:-} # additional disks (see README)
      # SERVICE_PATTERNS: ${SERVICE_PATTERNS:-} # systemd service patterns
      # EXCLUDE_SMART: ${EXCLUDE_SMART:-} # S.M.A.R.T. tuning
      # SMART_INTERVAL: ${SMART_INTERVAL:-1h} # S.M.A.R.T. tuning
      # ZFS_INTERVAL: ${ZFS_INTERVAL:-1h} # ZFS pool refresh
      # MEM_CALC: ${MEM_CALC:-} # default memory calc
      # NICS: ${NICS:-} # network interface filter
      # GPU_COLLECTOR: ${GPU_COLLECTOR:-} # GPU collector override
      # EXCLUDE_CONTAINERS: ${EXCLUDE_CONTAINERS:-} # docker container tuning
      # DOCKER_TIMEOUT: ${DOCKER_TIMEOUT:-2100ms} # docker container tuning
      # DOCKER_IMAGE_CHECK: ${DOCKER_IMAGE_CHECK:-true} # container image update checks (0.21+; set false to disable registry requests)
      # SKIP_WIFI: ${SKIP_WIFI:-false} # Wi-Fi signal monitoring (0.21+)
      # SKIP_SYSTEMD_LOGS: ${SKIP_SYSTEMD_LOGS:-false} # systemd service logs (0.21+)
    extends:
      file: docker-compose-agent.override.yaml
      service: ${HWACCEL:-none} # none|gpu-amd|gpu-nvidia|gpu-intel
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - socket:/beszel_socket
      - /dev:/dev:ro
      - /run/udev:/run/udev:ro
    healthcheck:
      test: ["CMD", "/agent", "health"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3

################################################################################
################################################################################
################################################################################
networks:
  default:
    driver: ${NETWORK_MODE:-overlay}
    attachable: true
    driver_opts:
      encrypted: "true"
  proxy:
    external: true

volumes:
  data: {}
  socket: {}
