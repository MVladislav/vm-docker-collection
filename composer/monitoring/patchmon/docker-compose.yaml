---
x-basic-deploy-labels: &basic-deploy-labels
  labels:
    - traefik.enable=true
    - traefik.swarm.lbswarm=${LB_SWARM:-true}
    - traefik.swarm.network=proxy
    - traefik.http.routers.patchmon.entrypoints=${TRAEFIK_ENTRYPOINT:-https}
    - traefik.http.routers.patchmon.rule=Host(`${DOMAIN?domain variable not set}`)
    - traefik.http.routers.patchmon.tls=true
    - traefik.http.routers.patchmon.tls.certresolver=${CERT_RESOLVER:-}
    - traefik.http.routers.patchmon.middlewares=${MIDDLEWARE_SECURED:-default-secured@file}
    - traefik.http.routers.patchmon.service=patchmon
    - traefik.http.services.patchmon.loadbalancer.server.scheme=${PROTOCOL:-http}
    - traefik.http.services.patchmon.loadbalancer.server.port=${PORT:-3000}

x-basic-deploy: &basic-deploy
  mode: replicated
  replicas: 1
  placement:
    max_replicas_per_node: 1
    constraints:
      - "node.role==${NODE_ROLE:-manager}"
      - node.platform.os == linux
  update_config:
    order: stop-first
  restart_policy:
    condition: any
  resources:
    limits:
      cpus: ${RESOURCES_LIMITS_CPUS:-1}
      memory: ${RESOURCES_LIMITS_MEMORY:-1g}
    reservations:
      cpus: ${RESOURCES_RESERVATIONS_CPUS:-0.001}
      memory: ${RESOURCES_RESERVATIONS_MEMORY:-32m}

x-basic: &basic
  env_file: ${ENV_FILE:-.env}
  cap_drop: ["ALL"]
  security_opt:
    - no-new-privileges:true
  ulimits:
    memlock:
      soft: -1
      hard: -1
    nofile:
      soft: 655360
      hard: 655360
    fsize: -1
    as: -1
  # mem_limit: ${RESOURCES_LIMITS_MEMORY:-1g}
  networks:
    default: {}
  healthcheck:
    disable: true
  tmpfs:
    - /tmp:rw,relatime,size=512m,nodev,nosuid,noexec
  restart: always

################################################################################
################################################################################
################################################################################
services:
  ##############################################################################
  ##############################################################################
  ##############################################################################
  patchmon-server:
    # https://github.com/patchmon/patchmon-server/pkgs/container/patchmon-server
    image: ghcr.io/patchmon/patchmon-server:${VERSION_PATCHMON:-2.1.3}
    <<:
      - *basic
      # - *basic-deploy-labels
    deploy:
      <<:
        - *basic-deploy
        - *basic-deploy-labels
    environment:
      CORS_ORIGIN: https://${DOMAIN?domain variable not set}
      DATABASE_URL: postgresql://${POSTGRES_USER:-patchmon}:${PATCHMON_DB_PW?PATCHMON_DB_PW password is not set}@postgresql:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-patchmon}
      REDIS_HOST: valkey
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_SECRET: ${JWT_SECRET?JWT_SECRET is not set}
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY?AI_ENCRYPTION_KEY is not set}
      SESSION_SECRET: ${SESSION_SECRET?SESSION_SECRET is not set}
      GUACD_ADDRESS: guacd:4822
      PORT: ${PORT:-3000}
      TZ: ${TZ:-Europe/Berlin}
      TRUST_PROXY: ${TRUST_PROXY:-true}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      default: {}
      proxy: {}

  ##############################################################################
  ##############################################################################
  ##############################################################################
  guacd:
    # https://hub.docker.com/r/guacamole/guacd
    image: guacamole/guacd:${VERSION_GUACD:-1.6.0}
    <<:
      - *basic
    deploy:
      <<: *basic-deploy
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_GUACD:-1}
          memory: ${RESOURCES_LIMITS_MEMORY_GUACD:-512m}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_GUACD:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_GUACD:-32m}
    read_only: true
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4822 || exit 1"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3

  ##############################################################################
  ##############################################################################
  ##############################################################################
  postgresql:
    # https://hub.docker.com/_/postgres
    image: postgres:${VERSION_POSTGRESQL:-18.6-alpine}
    <<: *basic
    deploy:
      <<: *basic-deploy
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_POSTGRESQL:-1}
          memory: ${RESOURCES_LIMITS_MEMORY_POSTGRESQL:-512m}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_POSTGRESQL:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_POSTGRESQL:-32m}
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_READ_SEARCH
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    secrets:
      - postgres_password_file
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patchmon}
      POSTGRES_USER: ${POSTGRES_USER:-patchmon}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password_file
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      PGDATA: /var/lib/postgresql/18/data
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - postgresql_v18:/var/lib/postgresql/18/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -d $${POSTGRES_DB} -U $${POSTGRES_USER}",
        ]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3

  ##############################################################################
  ##############################################################################
  ##############################################################################
  valkey:
    # https://hub.docker.com/r/valkey/valkey
    image: valkey/valkey:${VERSION_VALKEY:-9.1.2-alpine}
    <<: *basic
    deploy:
      <<: *basic-deploy
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_VALKEY:-1}
          memory: ${RESOURCES_LIMITS_MEMORY_VALKEY:-128m}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_VALKEY:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_VALKEY:-32m}
    cap_add:
      - SETUID
      - SETGID
    environment:
      ALLOW_EMPTY_PASSWORD: ${ALLOW_EMPTY_PASSWORD:-true}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - valkey:/data
    command: --port 6379 --save 300 1 --loglevel warning
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3

################################################################################
################################################################################
################################################################################
networks:
  default:
    internal: true
    driver: ${NETWORK_MODE:-overlay}
    attachable: true
    driver_opts:
      encrypted: "true"
  proxy:
    external: true

volumes:
  postgresql_v18: {}
  valkey: {}

secrets:
  postgres_password_file:
    file: config/secrets/postgres_password_file.txt
