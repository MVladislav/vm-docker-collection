---
name: forgejo-runner-dind

x-basic: &basic
  env_file: ${ENV_FILE:-.env}
  cap_drop: ["ALL"]
  security_opt:
    - no-new-privileges:true
  ulimits:
    memlock:
      soft: -1
      hard: -1
    nofile:
      soft: 655360
      hard: 655360
    fsize: -1
    as: -1
  mem_limit: ${RESOURCES_LIMITS_MEMORY:-1g}
  networks:
    default: {}
  healthcheck:
    disable: true
  tmpfs:
    - /tmp:rw,relatime,size=512m,nodev,nosuid,noexec
  restart: always

services:
  # Nested, isolated docker daemon. Needs `privileged` (unsupported in swarm).
  dind:
    image: docker:${VERSION_DIND:-29.8.1}-dind
    privileged: true
    environment:
      # no TLS on the internal 2375 socket (runner only, private network)
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - dind-data:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      default: {}
    restart: always

  # Forgejo Actions runner talking to the nested daemon only.
  runner:
    # https://code.forgejo.org/forgejo/-/packages/container/runner
    image: code.forgejo.org/forgejo/runner:${VERSION_RUNNER:-13.2.0}
    user: "0:0"
    <<:
      - *basic
    depends_on:
      dind:
        condition: service_healthy
    environment:
      TZ: ${TIMEZONE:-Europe/Berlin}
    configs:
      - source: runner_config
        target: /config.yml
        mode: 0440
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - runner-data:/data
    command: ["forgejo-runner", "daemon", "--config", "/config.yml"]

# bridge network for runner + dind; egress needed for the runner to reach
# Forgejo's PUBLIC url (traefik on the host) and dind to pull job images.
networks:
  default:
    driver: bridge
    attachable: false

volumes:
  runner-data: {}
  dind-data: {}

configs:
  runner_config:
    file: ${CONFIG_DIND_SOURCE:-$PWD/config/config-dind.yml}
