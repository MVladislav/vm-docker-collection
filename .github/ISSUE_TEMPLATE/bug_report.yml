---
name: Bug report
description: Report a problem with one of the compose stacks in this collection.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This form is for reporting bugs in this collection (compose files,
        configs, documentation). If you have a feature or enhancement request,
        please use the feature request template.

        For questions or support, please use
        [Discussions](https://github.com/MVladislav/vm-docker-collection/discussions).
  - type: input
    id: service
    attributes:
      label: Affected service
      description: >-
        Path of the affected stack folder, e.g.
        `composer/monitoring/uptime_kuma`.
      placeholder: composer/<category>/<service>
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Describe the problem
      description: >-
        What were you trying to do and what happened instead? Include the exact
        error message or a screenshot of the error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: >-
        Provide the commands you ran (e.g. `docker compose up -d`), the
        `env_file` / `.env` values used and what happened.
      render: bash
  - type: markdown
    attributes:
      value: |
        ## Environment
  - type: input
    id: docker-version
    attributes:
      label: Docker version
      description: Output of `docker --version` and `docker compose version`.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Deployment mode
      options:
        - Docker Compose
        - Docker Swarm
        - Podman
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Host OS
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Details
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >-
        Output of `docker compose logs`, the service logs or the compose
        validation (`docker compose config`). Anything that helps to reproduce
        the issue.
      render: txt
  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: >-
        Any other context, e.g. modified files, custom `.env` values (without
        secrets), screenshots. Drag and drop files here.
