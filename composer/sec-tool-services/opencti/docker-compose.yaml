---
x-basic-deploy-labels: &basic-deploy-labels
  labels:
    - traefik.enable=true
    - traefik.swarm.lbswarm=${LB_SWARM:-true}
    - traefik.swarm.network=proxy
    - traefik.http.routers.opencti.entrypoints=${TRAEFIK_ENTRYPOINT:-https}
    - traefik.http.routers.opencti.rule=Host(`${DOMAIN?domain variable not set}`)
    - traefik.http.routers.opencti.tls=true
    - traefik.http.routers.opencti.tls.certresolver=${CERT_RESOLVER:-}
    - traefik.http.routers.opencti.middlewares=${MIDDLEWARE_SECURED:-default-secured@file}
    - traefik.http.routers.opencti.service=opencti
    - traefik.http.services.opencti.loadbalancer.server.scheme=${PROTOCOL:-http}
    - traefik.http.services.opencti.loadbalancer.server.port=${PORT:-8080}

x-basic-deploy: &basic-deploy
  mode: replicated
  replicas: 1
  placement:
    max_replicas_per_node: 1
    constraints:
      - "node.role==${NODE_ROLE:-manager}"
      - node.platform.os == linux
  update_config:
    order: stop-first
  restart_policy:
    condition: any
  resources:
    limits:
      cpus: ${RESOURCES_LIMITS_CPUS:-1}
      memory: ${RESOURCES_LIMITS_MEMORY:-1g}
    reservations:
      cpus: ${RESOURCES_RESERVATIONS_CPUS:-0.001}
      memory: ${RESOURCES_RESERVATIONS_MEMORY:-32m}

x-basic: &basic
  env_file: ${ENV_FILE:-.env}
  cap_drop: ["ALL"]
  security_opt:
    - no-new-privileges:true
  ulimits:
    memlock:
      soft: -1
      hard: -1
    nofile:
      soft: 655360
      hard: 655360
    fsize: -1
    as: -1
  networks:
    default: {}
  healthcheck:
    disable: true
  tmpfs:
    - /tmp:rw,relatime,size=512m,nodev,nosuid,noexec
  restart: always

################################################################################
################################################################################
################################################################################
x-opencti: &opencti
  OPENCTI_URL: http://opencti:8080
  OPENCTI_TOKEN: ${OPENCTI_ADMIN_TOKEN}

x-opencti-connector: &opencti-connector
  CONNECTOR_TYPE: INTERNAL_EXPORT_FILE
  CONNECTOR_LOG_LEVEL: info

services:
  ##############################################################################
  ##############################################################################
  ##############################################################################
  opencti:
    # https://hub.docker.com/r/opencti/platform
    image: opencti/platform:${VERSION_OPENCTI:-7.261002.0}
    <<:
      - *basic
      # -  *basic-deploy-labels
    deploy:
      <<:
        - *basic-deploy
        - *basic-deploy-labels
    environment:
      APP__ADMIN__EMAIL: ${OPENCTI_ADMIN_EMAIL:-groot@home.local}
      APP__ADMIN__PASSWORD: ${OPENCTI_ADMIN_PASSWORD}
      APP__ADMIN__TOKEN: ${OPENCTI_ADMIN_TOKEN}
      APP__ENCRYPTION_KEY: ${OPENCTI_ENCRYPTION_KEY?OPENCTI_ENCRYPTION_KEY is not set}
      APP__HEALTH_ACCESS_KEY: ${APP__HEALTH_ACCESS_KEY}

      APP__PORT: ${PORT:-8080}
      APP__BASE_URL: https://${DOMAIN?domain variable not set}
      APP__APP_LOGS__LOGS_LEVEL: error
      NODE_OPTIONS: --max-old-space-size=8096
      PROVIDERS__LOCAL__STRATEGY: LocalStrategy

      REDIS__HOSTNAME: valkey
      REDIS__PORT: 6379

      ELASTICSEARCH__URL: http://opensearch:9200
      ELASTICSEARCH__NUMBER_OF_REPLICAS: 0
      ELASTICSEARCH__ENGINE_SELECTOR: opensearch
      # Since 7.260401.0 the graphQL `filter` option refuses custom script
      # expressions ("Filter script is not allowed") unless this is set. Only
      # needed if a dashboard, view or connector uses a filter script.
      # ELASTICSEARCH__UNSECURE_SCRIPT_FILTER_ENABLED: ${ELASTICSEARCH_UNSECURE_SCRIPT_FILTER_ENABLED:-false}
      # Only with the OpenSearch security plugin enabled (see the `opensearch`
      # service); the plugin ignores them while it is disabled:
      # ELASTICSEARCH__USERNAME: admin
      # ELASTICSEARCH__PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD?OPENSEARCH_ADMIN_PASSWORD is not set}

      MINIO__ENDPOINT: rustfs
      MINIO__PORT: 9000
      MINIO__USE_SSL: false
      MINIO__ACCESS_KEY: ${OPENCTI_RUSTFS_ACCESS_KEY}
      MINIO__SECRET_KEY: ${OPENCTI_RUSTFS_SECRET_KEY}

      RABBITMQ__HOSTNAME: rabbitmq
      RABBITMQ__PORT: 5672
      RABBITMQ__PORT_MANAGEMENT: 15672
      RABBITMQ__MANAGEMENT_SSL: false
      RABBITMQ__USERNAME: ${RABBITMQ_DEFAULT_USER:-rabbitmq}
      RABBITMQ__PASSWORD: ${OPENCTI_RABBITMQ_PASSWORD}

      SMTP__ENABLED: ${SMTP_ENABLED:-false}
      SMTP__HOSTNAME: ${SMTP_HOSTNAME:-}
      SMTP__PORT: ${SMTP_PORT:-25}
      # SMTP__USE_SSL: ${SMTP_USE_SSL:-false} # implicit TLS, 465
      # SMTP__REJECT_UNAUTHORIZED: ${SMTP_REJECT_UNAUTHORIZED:-false}
      # SMTP__AUTH_TYPE: ${SMTP_AUTH_TYPE:-basic} # basic | oauth2
      # SMTP__USERNAME: ${SMTP_USERNAME:-}
      # SMTP__PASSWORD: ${SMTP_PASSWORD:-}
      # SMTP__FORCED_SENDER_EMAIL: ${SMTP_FORCED_SENDER_EMAIL:-}

      TRUST_PROXY_ADDRESSES: ${TRUST_PROXY_ADDRESSES:-172.16.0.0/12}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      default: {}
      proxy: {}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:8080/health?health_access_key=${APP__HEALTH_ACCESS_KEY}",
        ]
      start_period: 900s
      interval: 30s
      timeout: 5s
      retries: 10

  ##############################################################################
  ##############################################################################
  ##############################################################################
  worker:
    # https://hub.docker.com/r/opencti/worker
    image: opencti/worker:${VERSION_OPENCTI:-7.261002.0}
    <<: *basic
    deploy:
      <<: *basic-deploy
      replicas: 1
    environment:
      <<: *opencti
      WORKER_LOG_LEVEL: info
  connector-export-file-stix:
    # https://hub.docker.com/r/opencti/connector-export-file-stix
    image: opencti/connector-export-file-stix:${VERSION_OPENCTI:-7.261002.0}
    <<: *basic
    deploy:
      <<: *basic-deploy
    environment:
      <<: [*opencti, *opencti-connector]
      CONNECTOR_ID: ${CONNECTOR_EXPORT_FILE_STIX_ID} # Valid UUIDv4
      CONNECTOR_NAME: ExportFileStix2
      CONNECTOR_SCOPE: application/json
  connector-export-file-csv:
    # https://hub.docker.com/r/opencti/connector-export-file-csv
    image: opencti/connector-export-file-csv:${VERSION_OPENCTI:-7.261002.0}
    <<: *basic
    deploy:
      <<: *basic-deploy
    environment:
      <<: [*opencti, *opencti-connector]
      CONNECTOR_ID: ${CONNECTOR_EXPORT_FILE_CSV_ID} # Valid UUIDv4
      CONNECTOR_NAME: ExportFileCsv
      CONNECTOR_SCOPE: text/csv
  connector-export-file-txt:
    # https://hub.docker.com/r/opencti/connector-export-file-txt
    image: opencti/connector-export-file-txt:${VERSION_OPENCTI:-7.261002.0}
    <<: *basic
    deploy:
      <<: *basic-deploy
    environment:
      <<: [*opencti, *opencti-connector]
      CONNECTOR_ID: ${CONNECTOR_EXPORT_FILE_TXT_ID} # Valid UUIDv4
      CONNECTOR_NAME: ExportFileTxt
      CONNECTOR_SCOPE: text/plain
  connector-import-file-stix:
    # https://hub.docker.com/r/opencti/connector-import-file-stix
    image: opencti/connector-import-file-stix:${VERSION_OPENCTI:-7.261002.0}
    <<: *basic
    deploy:
      <<: *basic-deploy
    environment:
      <<: [*opencti, *opencti-connector]
      CONNECTOR_ID: ${CONNECTOR_IMPORT_FILE_STIX_ID} # Valid UUIDv4
      CONNECTOR_TYPE: INTERNAL_IMPORT_FILE
      CONNECTOR_NAME: ImportFileStix
      CONNECTOR_VALIDATE_BEFORE_IMPORT: ${CONNECTOR_VALIDATE_BEFORE_IMPORT:-true} # Validate any bundle before import
      CONNECTOR_SCOPE: application/json,text/xml
      CONNECTOR_AUTO: ${CONNECTOR_AUTO:-true} # Enable/disable auto-import of file
  connector-import-document:
    # https://hub.docker.com/r/opencti/connector-import-document
    image: opencti/connector-import-document:${VERSION_OPENCTI:-7.261002.0}
    <<: *basic
    deploy:
      <<: *basic-deploy
    environment:
      <<: [*opencti, *opencti-connector]
      CONNECTOR_ID: ${CONNECTOR_IMPORT_DOCUMENT_ID} # Valid UUIDv4
      CONNECTOR_TYPE: INTERNAL_IMPORT_FILE
      CONNECTOR_NAME: ImportDocument
      CONNECTOR_VALIDATE_BEFORE_IMPORT: ${CONNECTOR_VALIDATE_BEFORE_IMPORT:-true} # Validate any bundle before import
      CONNECTOR_SCOPE: application/pdf,text/plain,text/html
      CONNECTOR_AUTO: ${CONNECTOR_AUTO:-true} # Enable/disable auto-import of file
      CONNECTOR_ONLY_CONTEXTUAL: ${CONNECTOR_ONLY_CONTEXTUAL:-false} # Only extract data related to an entity (a report, a threat actor, etc.)
      CONNECTOR_CONFIDENCE_LEVEL: 15 # From 0 (Unknown) to 100 (Fully trusted)
      IMPORT_DOCUMENT_CREATE_INDICATOR: ${IMPORT_DOCUMENT_CREATE_INDICATOR:-true}
  connector-analysis:
    # https://hub.docker.com/r/opencti/connector-import-document
    image: opencti/connector-import-document:${VERSION_OPENCTI:-7.261002.0}
    <<: *basic
    deploy:
      <<: *basic-deploy
    environment:
      <<: [*opencti, *opencti-connector]
      CONNECTOR_ID: ${CONNECTOR_ANALYSIS_ID} # Valid UUIDv4
      CONNECTOR_TYPE: INTERNAL_ANALYSIS
      CONNECTOR_NAME: ImportDocumentAnalysis
      CONNECTOR_VALIDATE_BEFORE_IMPORT: ${CONNECTOR_VALIDATE_BEFORE_IMPORT:-false} # Validate any bundle before import
      CONNECTOR_SCOPE: application/pdf,text/plain,text/html
      CONNECTOR_AUTO: ${CONNECTOR_AUTO:-true} # Enable/disable auto-import of file
      CONNECTOR_ONLY_CONTEXTUAL: ${CONNECTOR_ONLY_CONTEXTUAL:-false} # Only extract data related to an entity (a report, a threat actor, etc.)
      CONNECTOR_CONFIDENCE_LEVEL: 15 # From 0 (Unknown) to 100 (Fully trusted)

  ##############################################################################
  ##############################################################################
  ##############################################################################
  opensearch:
    # https://hub.docker.com/r/opensearchproject/opensearch
    image: opensearchproject/opensearch:${VERSION_OPENSEARCH:-3.9.0}
    <<: *basic
    deploy:
      <<: *basic-deploy
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_OPENSEARCH:-2}
          memory: ${RESOURCES_LIMITS_MEMORY_OPENSEARCH:-4g}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_OPENSEARCH:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_OPENSEARCH:-32m}
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_READ_SEARCH
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      plugins.security.disabled: "true"
      thread_pool.search.queue_size: 5000
      logger.org.opensearch.discovery: "ERROR"
      OPENSEARCH_JAVA_OPTS: -Xms${OPENSEARCH_HEAP_SIZE:-2g} -Xmx${OPENSEARCH_HEAP_SIZE:-2g}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null || exit 1",
        ]
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 3

  ##############################################################################
  ##############################################################################
  ##############################################################################
  rabbitmq:
    # https://hub.docker.com/_/rabbitmq
    image: rabbitmq:${VERSION_RABBITMQ:-4.3.6-management-alpine}
    <<: *basic
    deploy:
      <<: *basic-deploy
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_RABBITMQ:-1}
          memory: ${RESOURCES_LIMITS_MEMORY_RABBITMQ:-512m}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_RABBITMQ:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_RABBITMQ:-32m}
    cap_add:
      - SETGID # Allows setting group ID (`setgid`,`newgrp`,`chgrp`,`setregid()`)
      - SETUID # Allows setting user ID (`setuid`,`su`,`sudo`,`passwd`)
      - CHOWN
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-rabbitmq}
      RABBITMQ_DEFAULT_PASS: ${OPENCTI_RABBITMQ_PASSWORD?OPENCTI_RABBITMQ_PASSWORD is not set}
      RABBITMQ_NODENAME: ${RABBITMQ_NODENAME:-rabbit01@localhost}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "su-exec", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3

  ##############################################################################
  ##############################################################################
  ##############################################################################
  valkey:
    # https://hub.docker.com/r/valkey/valkey
    image: valkey/valkey:${VERSION_VALKEY:-9.1.2-alpine}
    <<: *basic
    deploy:
      <<: *basic-deploy
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_VALKEY:-1}
          memory: ${RESOURCES_LIMITS_MEMORY_VALKEY:-128m}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_VALKEY:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_VALKEY:-32m}
    cap_add:
      - SETUID
      - SETGID
    environment:
      ALLOW_EMPTY_PASSWORD: ${ALLOW_EMPTY_PASSWORD:-true}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - valkey:/data
    command: --port 6379 --save 300 1 --loglevel warning
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3

  ##############################################################################
  ##############################################################################
  ##############################################################################
  rustfs:
    # https://hub.docker.com/r/rustfs/rustfs/tags
    image: rustfs/rustfs:${VERSION_RUSTFS:-1.0.1}
    <<: *basic
    deploy:
      <<: *basic-deploy
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_RUSTFS:-1}
          memory: ${RESOURCES_LIMITS_MEMORY_RUSTFS:-1g}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_RUSTFS:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_RUSTFS:-32m}
    secrets:
      - rustfs_access_key_file
      - rustfs_secret_key_file
    environment:
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/rustfs_access_key_file
      RUSTFS_SECRET_KEY_FILE: /run/secrets/rustfs_secret_key_file
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:${PORT_RUSTFS_S3_API:-9000}
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:${PORT_RUSTFS_CONSOLE:-9001}
      RUSTFS_CONSOLE_ENABLE: ${RUSTFS_CONSOLE_ENABLE:-true}
      RUSTFS_OBS_LOGGER_LEVEL: ${RUSTFS_OBS_LOGGER_LEVEL:-info}
      RUSTFS_OBS_LOG_DIRECTORY: ${RUSTFS_OBS_LOG_DIRECTORY:-/logs}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - rustfs_data:/data
      - rustfs_logs:/logs
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "curl -f http://127.0.0.1:${PORT_RUSTFS_S3_API:-9000}/health",
        ]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3

################################################################################
################################################################################
################################################################################
networks:
  default:
    name: opencti
    driver: ${NETWORK_MODE:-overlay}
    attachable: true
    driver_opts:
      encrypted: "true"
  proxy:
    external: true

volumes:
  opensearch_data: {}
  rabbitmq_data: {}
  valkey: {}
  rustfs_data: {}
  rustfs_logs: {}

secrets:
  opencti_admin_password_file:
    file: config/secrets/opencti_admin_password_file.txt
  opencti_token_file:
    file: config/secrets/opencti_token_file.txt
  rustfs_access_key_file:
    file: config/secrets/rustfs_access_key_file.txt
  rustfs_secret_key_file:
    file: config/secrets/rustfs_secret_key_file.txt
