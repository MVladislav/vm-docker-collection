---
x-basic-deploy-labels: &basic-deploy-labels
  labels:
    - traefik.enable=true
    - traefik.swarm.lbswarm=${LB_SWARM:-true}
    - traefik.swarm.network=proxy
    - traefik.http.routers.netmaker-ui.entrypoints=https
    - traefik.http.routers.netmaker-ui.rule=Host(`dashboard.${DOMAIN?domain variable not set}`)

    - traefik.http.routers.netmaker-ui.service=netmaker-ui
    - traefik.http.services.netmaker-ui.loadbalancer.server.scheme=${PROTOCOL_NETMAKER_UI:-http}
    - traefik.http.services.netmaker-ui.loadbalancer.server.port=${PORT_NETMAKER_UI:-80}

    - traefik.http.routers.netmaker-ui.middlewares=nmui-security@docker
    - traefik.http.middlewares.nmui-security.headers.accessControlAllowOriginList=*.${DOMAIN}
    - traefik.http.middlewares.nmui-security.headers.stsSeconds=31536000
    - traefik.http.middlewares.nmui-security.headers.browserXssFilter=true
    - traefik.http.middlewares.nmui-security.headers.customFrameOptionsValue=SAMEORIGIN
    - traefik.http.middlewares.nmui-security.headers.customResponseHeaders.X-Robots-Tag=none
    - traefik.http.middlewares.nmui-security.headers.customResponseHeaders.Server=

x-basic-deploy-labels-api: &basic-deploy-labels-api
  labels:
    - traefik.enable=true
    - traefik.swarm.lbswarm=${LB_SWARM:-true}
    - traefik.swarm.network=proxy
    - traefik.http.routers.netmaker-api.entrypoints=https
    - traefik.http.routers.netmaker-api.rule=Host(`api.${DOMAIN?domain variable not set}`)
    - traefik.http.routers.netmaker-api.service=netmaker-api
    - traefik.http.services.netmaker-api.loadbalancer.server.scheme=${PROTOCOL_NETMAKER_API:-http}
    - traefik.http.services.netmaker-api.loadbalancer.server.port=${PORT_NETMAKER_API:-8081}

x-basic-deploy-labels-mq: &basic-deploy-labels-mq
  labels:
    - traefik.enable=true
    - traefik.swarm.lbswarm=${LB_SWARM:-true}
    - traefik.swarm.network=proxy
    - traefik.tcp.routers.mqtt.entrypoints=${TRAEFIK_ENTRYPOINT_MQTT:-mqtt}
    - traefik.tcp.routers.mqtt.rule=HostSNI(`broker.${DOMAIN?domain variable not set}`)
    - traefik.tcp.routers.mqtt.tls=true
    - traefik.tcp.routers.mqtt.tls.certresolver=${CERT_RESOLVER:-}
    - traefik.tcp.services.mqtt.loadbalancer.server.port=${PORT_MQTT:-8883}

x-basic-deploy: &basic-deploy
  mode: replicated
  replicas: 1
  placement:
    max_replicas_per_node: 1
    constraints:
      - "node.role==${NODE_ROLE:-manager}"
      - node.platform.os == linux
  restart_policy:
    condition: on-failure
  resources:
    limits:
      # cpus: "1.5"
      memory: 1g # 500M
    reservations:
      cpus: "0.001"
      memory: 32M

x-basic: &basic
  env_file: ${ENV_FILE:-.env}
  cap_drop: ["ALL"]
  ulimits:
    memlock:
      soft: -1
      hard: -1
    nofile:
      soft: 65535
      hard: 65535
    fsize: -1
    as: -1
  networks:
    default: {}
  tmpfs:
    - /tmp
  restart: always # always | on-failure

################################################################################
################################################################################
################################################################################

services:
  ##############################################################################
  ##############################################################################
  ##############################################################################
  netmaker:
    # https://hub.docker.com/r/gravitl/netmaker
    image: gravitl/netmaker:${VERSION_NETMAKER:-v1.7.0}
    <<:
      - *basic
      - *basic-deploy-labels-api
    deploy:
      <<:
        - *basic-deploy
        - *basic-deploy-labels-api
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
    ports:
      - "51821-51830:51821-51830/udp"
    environment:
      NM_DOMAIN: "${DOMAIN}"
      FRONTEND_URL: "https://dashboard.${DOMAIN}"
      SERVER_NAME: "${DOMAIN}"
      SERVER_HOST: "${SERVER_PUBLIC_IP}"
      SERVER_API_CONN_STRING: "api.${DOMAIN}:443"
      COREDNS_ADDR: "${SERVER_PUBLIC_IP}"
      DNS_MODE: "on"
      SERVER_HTTP_HOST: "api.${DOMAIN}"
      API_PORT: "8081"
      SERVER_BROKER_ENDPOINT: "ws://mq:1883"
      BROKER_ENDPOINT: "wss://broker.${DOMAIN}"
      STUN_SERVERS: "${STUN_SERVERS:-stun1.l.google.com:19302,stun2.l.google.com:19302,stun3.l.google.com:19302,stun4.l.google.com:19302}"
      MQ_USERNAME: "${MQ_USERNAME}"
      MQ_PASSWORD: "${MQ_PASSWORD}"
      MASTER_KEY: "${MASTER_KEY}"
      CORS_ALLOWED_ORIGIN: "*"
      DISPLAY_KEYS: "on"
      DATABASE: "postgres"
      SQL_CONN: "postgres"
      SQL_HOST: "postgresql"
      SQL_PORT: "5432"
      SQL_DB: "${SQL_DB:-netmaker}"
      SQL_USER: "${SQL_USER:-netmaker}"
      SQL_PASS: "${SQL_PASS:?SQL_PASS is not set}"
      SQL_SSL_MODE: "${SQL_SSL_MODE:-disable}"
      HOST_NAME: "netmaker-server-1"
      VERBOSITY: "1"
      TELEMETRY: "off"
      # AUTH_PROVIDER: "github"
      # CLIENT_ID: "${AUTH_PROVIDER_CLIENT_ID}"
      # CLIENT_SECRET: "${AUTH_PROVIDER_CLIENT_SECRET}"
      # SAAS_OWNER_EMAIL: "${SAAS_OWNER_EMAIL}"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - dnsconfig:/root/config/dnsconfig
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
    networks:
      default:
        aliases:
          # swarm-safe replacement for the upstream `links: ["netmaker:api"]`
          - api
      proxy: {}

  ##############################################################################
  ##############################################################################
  ##############################################################################
  netmaker-ui:
    # https://hub.docker.com/r/gravitl/netmaker-ui
    image: gravitl/netmaker-ui:${VERSION_NETMAKER_UI:-v1.7.0}
    <<:
      - *basic
      - *basic-deploy-labels
    deploy:
      <<:
        - *basic-deploy
        - *basic-deploy-labels
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    environment:
      BACKEND_URL: "https://api.${DOMAIN}"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      default: {}
      proxy: {}

  ##############################################################################
  ##############################################################################
  ##############################################################################
  coredns:
    # https://hub.docker.com/r/coredns/coredns
    image: coredns/coredns:${VERSION_COREDNS:-1.14.7}
    <<: *basic
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - dnsconfig:/root/dnsconfig
    command: -conf /root/dnsconfig/Corefile
    restart: always

  ##############################################################################
  ##############################################################################
  ##############################################################################
  mq:
    # https://hub.docker.com/_/eclipse-mosquitto
    image: eclipse-mosquitto:${VERSION_MQTT:-2.0.22-openssl}
    <<:
      - *basic
      - *basic-deploy-labels-mq
    deploy:
      <<:
        - *basic-deploy
        - *basic-deploy-labels-mq
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    environment:
      NETMAKER_SERVER_HOST: "https://api.${DOMAIN}"
      # wait.sh turns these into /mosquitto/password.txt (mosquitto_passwd -U)
      MQ_USERNAME: "${MQ_USERNAME}"
      MQ_PASSWORD: "${MQ_PASSWORD}"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./config/wait.sh:/mosquitto/config/wait.sh
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    command: ["/bin/bash", "/mosquitto/config/wait.sh"]
    networks:
      default: {}
      proxy: {}

  ##############################################################################
  ##############################################################################
  ##############################################################################
  postgresql:
    # https://hub.docker.com/_/postgres
    image: postgres:${VERSION_POSTGRESQL:-18.6-alpine}
    <<: *basic
    deploy:
      <<: *basic-deploy
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_POSTGRESQL:-1}
          memory: ${RESOURCES_LIMITS_MEMORY_POSTGRESQL:-1g}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_POSTGRESQL:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_POSTGRESQL:-32m}
    environment:
      POSTGRES_DB: ${SQL_DB:-netmaker}
      POSTGRES_USER: ${SQL_USER:-netmaker}
      POSTGRES_PASSWORD: ${SQL_PASS:?SQL_PASS is not set}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SQL_USER:-netmaker} -d ${SQL_DB:-netmaker}",
        ]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      default: {}

################################################################################
################################################################################
################################################################################

networks:
  default:
    driver: ${NETWORK_MODE:-overlay}
    attachable: true
    driver_opts:
      encrypted: "true"
  proxy:
    external: true

volumes:
  dnsconfig: {}
  mosquitto_data: {}
  postgresql_data: {}
  mosquitto_logs: {}
