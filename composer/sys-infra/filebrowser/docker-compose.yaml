---
x-basic-deploy-labels: &basic-deploy-labels
  labels:
    - traefik.enable=true
    - traefik.swarm.lbswarm=${LB_SWARM:-true}
    - traefik.swarm.network=proxy
    - traefik.http.routers.filebrowser.entrypoints=${TRAEFIK_ENTRYPOINT:-https}
    - traefik.http.routers.filebrowser.rule=Host(`${DOMAIN?domain variable not set}`)
    - traefik.http.routers.filebrowser.tls=true
    - traefik.http.routers.filebrowser.tls.certresolver=${CERT_RESOLVER:-}
    - traefik.http.routers.filebrowser.middlewares=${MIDDLEWARE_SECURED:-default-secured@file}
    - traefik.http.routers.filebrowser.service=filebrowser
    - traefik.http.services.filebrowser.loadbalancer.server.scheme=${PROTOCOL:-http}
    - traefik.http.services.filebrowser.loadbalancer.server.port=${PORT_FILEBROWSER:-8080}

x-basic-deploy: &basic-deploy
  mode: replicated
  replicas: 1
  placement:
    max_replicas_per_node: 1
    constraints:
      - "node.role==${NODE_ROLE:-manager}"
      - node.platform.os == linux
  update_config:
    order: stop-first
  restart_policy:
    condition: any
  resources:
    limits:
      cpus: ${RESOURCES_LIMITS_CPUS:-1}
      memory: ${RESOURCES_LIMITS_MEMORY:-1g}
    reservations:
      cpus: ${RESOURCES_RESERVATIONS_CPUS:-0.001}
      memory: ${RESOURCES_RESERVATIONS_MEMORY:-128m}

x-basic: &basic
  env_file: ${ENV_FILE:-.env}
  cap_drop: ["ALL"]
  security_opt:
    - no-new-privileges:true
  ulimits:
    memlock:
      soft: -1
      hard: -1
    nofile:
      soft: 655360
      hard: 655360
    fsize: -1
    as: -1
  networks:
    proxy: {}
  healthcheck:
    disable: true
  tmpfs:
    - /tmp:rw,relatime,size=512m,nodev,nosuid,noexec
  restart: always

################################################################################
################################################################################
################################################################################
services:
  ##############################################################################
  ##############################################################################
  ##############################################################################
  filebrowser:
    # https://github.com/gtsteffaniak/filebrowser/pkgs/container/filebrowser
    image: ghcr.io/gtsteffaniak/filebrowser:${VERSION_FILEBROWSER:-2.0.0-stable}
    user: "915:915"
    <<:
      - *basic
      # - *basic-deploy-labels
    deploy:
      <<:
        - *basic-deploy
        - *basic-deploy-labels
    environment:
      TZ: ${TZ:-Europe/Berlin}
      FILEBROWSER_CONFIG: /home/filebrowser/config.yaml
      FILEBROWSER_ADMIN_PASSWORD: ${FILEBROWSER_ADMIN_PASSWORD?admin password is not set}
    configs:
      - source: filebrowser_config
        target: /home/filebrowser/config.yaml
        mode: 0440
        uid: "915"
        gid: "915"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - data:/home/filebrowser/data
      - nas-data:/srv
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:${PORT_FILEBROWSER:-8080}/health || exit 1",
        ]
      start_period: 120s
      interval: 30s
      timeout: 5s
      retries: 3

################################################################################
################################################################################
################################################################################
networks:
  proxy:
    external: true

volumes:
  data:
    name: filebrowser_data
  nas-data:
    driver: local
    driver_opts:
      type: nfs
      o: nfsvers=4.2,addr=${NFS_HOST?NFS host is not defined},rsize=2097152,wsize=2097152,tcp,nconnect=${NFS_NCON:-8}
      device: ":${NFS_PATH?NFS path is not defined}"

configs:
  filebrowser_config:
    file: $PWD/config/filebrowser.yaml
