---
# Local replacement for crowdsecurity/http-sqli-probing (DISABLE_SCENARIOS).
# Same 1s leakspeed problem as the XSS scenario: a console search/filter that sends
# several SQL-ish queries in parallel overflows it. `data:` must stay, it downloads
# sqli_probe_patterns.txt on a fresh volume.
type: leaky
format: 2.0
name: pangolin/http-sqli-probing
data:
  - source_url: https://hub-data.crowdsec.net/web/sqli_probe_patterns.txt
    dest_file: sqli_probe_patterns.txt
    type: string
description: "SQL injection probing with distinct payloads, rate-tolerant (local)"
filter: "evt.Meta.log_type in ['http_access-log', 'http_error-log'] && any(File('sqli_probe_patterns.txt'), {Upper(evt.Parsed.http_args) contains Upper(#)})"
groupby: evt.Meta.source_ip
distinct: evt.Parsed.http_args
capacity: 40
leakspeed: "60s"
blackhole: 5m
labels:
  remediation: true
  classification:
    - attack.T1595.002
  behavior: "http:exploit"
  label: "SQL Injection Attempt"
  spoofable: 0
  service: http
  confidence: 3
