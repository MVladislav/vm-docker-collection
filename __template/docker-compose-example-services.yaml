---
services:
  ##############################################################################
  ##############################################################################
  ##############################################################################
  dragonfly:
    # https://github.com/dragonflydb/dragonfly/releases
    image: docker.dragonflydb.io/dragonflydb/dragonfly:${VERSION_DRAGONFLY:-v1.38.1}
    # <<: *basic
    deploy:
      # <<: *basic-deploy
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_DRAGONFLY:-1}
          memory: ${RESOURCES_LIMITS_MEMORY_DRAGONFLY:-512m}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_DRAGONFLY:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_DRAGONFLY:-32m}
    cap_add:
      - SETUID
      - SETGID
    volumes:
      # - /etc/timezone:/etc/timezone:ro
      # - /etc/localtime:/etc/localtime:ro
      - dragonfly:/data
    # networks:
    #   default: {}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3

  ##############################################################################
  ##############################################################################
  ##############################################################################
  valkey:
    # https://hub.docker.com/r/valkey/valkey
    image: valkey/valkey:${VERSION_VALKEY:-9.1.2-alpine}
    # <<: *basic
    deploy:
      # <<: *basic-deploy
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_VALKEY:-1}
          memory: ${RESOURCES_LIMITS_MEMORY_VALKEY:-128m}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_VALKEY:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_VALKEY:-32m}
    # ports:
    #   - target: 6379
    #     published: 6379
    #     protocol: tcp
    #     # host_ip: 127.0.0.1
    #     mode: host
    cap_add:
      - SETUID
      - SETGID
    environment:
      ALLOW_EMPTY_PASSWORD: ${ALLOW_EMPTY_PASSWORD:-true}
      # VALKEY_EXTRA_FLAGS: --maxmemory 128mb --maxmemory-policy volatile-lfu
      # VALKEY_EXTRA_FLAGS: --requirepass ${VALKEY_PASSWORD?VALKEY_PASSWORD not set}
    volumes:
      # - /etc/timezone:/etc/timezone:ro
      # - /etc/localtime:/etc/localtime:ro
      - valkey:/data
    command: --port 6379 --save 300 1 --loglevel warning
    # networks:
    #   default: {}
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      # test: ["CMD-SHELL", 'valkey-cli -a "${VALKEY_PASSWORD?VALKEY_PASSWORD not set}" ping | grep PONG']
      # test: ["CMD", "valkey-", "--raw", "incr", "ping"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3

  ##############################################################################
  ##############################################################################
  ##############################################################################
  minio:
    # https://hub.docker.com/r/minio/minio/tags?name=RELEASE.202
    image: minio/minio:${VERSION_MINIO:-RELEASE.2025-09-07T16-13-09Z-cpuv1}
    # <<: *basic
    deploy:
      # <<: *basic-deploy
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_MINIO:-1}
          memory: ${RESOURCES_LIMITS_MEMORY_MINIO:-1g}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_MINIO:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_MINIO:-32m}
    # ports:
    #   - target: ${PORT_MINIO:-9001}
    #     published: ${PORT_MINIO_PUBLISH:-9001}
    #     protocol: tcp
    #     # host_ip: 127.0.0.1
    #     mode: host
    secrets:
      - minio_root_password_file
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password_file
      # MINIO_BROWSER_REDIRECT_URL: https://${DOMAIN?domain variable not set}
    volumes:
      # - /etc/timezone:/etc/timezone:ro
      # - /etc/localtime:/etc/localtime:ro
      - minio:/data
    command: server /data --console-address ":9001"
    # networks:
    #   default: {}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3

  ##############################################################################
  ##############################################################################
  ##############################################################################
  rustfs:
    # https://hub.docker.com/r/rustfs/rustfs/tags
    # https://github.com/rustfs/rustfs/releases
    # Alpine (musl) is the default build; use `<version>-glibc` (e.g. 1.0.0-glibc)
    # when the host cannot run musl binaries.
    image: rustfs/rustfs:${VERSION_RUSTFS:-1.0.0}
    # <<: *basic
    deploy:
      # <<: *basic-deploy
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_RUSTFS:-1}
          memory: ${RESOURCES_LIMITS_MEMORY_RUSTFS:-1g}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_RUSTFS:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_RUSTFS:-32m}
    # ports:
    #   - target: ${PORT_RUSTFS_S3_API:-9000}
    #     published: ${PORT_RUSTFS_S3_API_PUBLISH:-9000}
    #     protocol: tcp
    #     # host_ip: 127.0.0.1
    #     mode: host
    #   - target: ${PORT_RUSTFS_CONSOLE:-9001}
    #     published: ${PORT_RUSTFS_PUBLISH_CONSOLE:-9001}
    #     protocol: tcp
    #     # host_ip: 127.0.0.1
    #     mode: host
    secrets:
      - rustfs_access_key_file
      - rustfs_secret_key_file
    environment:
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/rustfs_access_key_file
      RUSTFS_SECRET_KEY_FILE: /run/secrets/rustfs_secret_key_file

      RUSTFS_VOLUMES: /data/rustfs{0...3}

      RUSTFS_ADDRESS: 0.0.0.0:${PORT_RUSTFS_S3_API:-9000}
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:${PORT_RUSTFS_CONSOLE:-9001}

      RUSTFS_CONSOLE_ENABLE: ${RUSTFS_CONSOLE_ENABLE:-true}
      RUSTFS_CORS_ALLOWED_ORIGINS: ${RUSTFS_CORS_ALLOWED_ORIGINS:-*}
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: ${RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS:-*}
      RUSTFS_OBS_LOGGER_LEVEL: ${RUSTFS_OBS_LOGGER_LEVEL:-info}
      RUSTFS_OBS_LOG_DIRECTORY: ${RUSTFS_OBS_LOG_DIRECTORY:-/logs}
      # RUSTFS_TLS_PATH: ${RUSTFS_TLS_PATH:-/opt/tls}

      # Opt out of the weekly "new RustFS release available" check.
      RUSTFS_CHECK_UPDATE: ${RUSTFS_CHECK_UPDATE:-false}
      # On-demand migration (pull from a foreign S3 bucket on a read miss) ships
      # enabled since 1.0.0-rc.5. Harmless without a configured source bucket,
      # but a self-hosted stack should not carry the switch on.
      RUSTFS_ON_DEMAND_MIGRATION_ENABLED: ${RUSTFS_ON_DEMAND_MIGRATION_ENABLED:-false}

      # Object data cache (opt-in, upstream default is disabled). Caching object
      # bodies lets co-tenant readers observe a bucket's recent access patterns,
      # so keep it off for buckets shared between mutually untrusted parties.
      RUSTFS_OBJECT_DATA_CACHE_ENABLE: ${RUSTFS_OBJECT_DATA_CACHE_ENABLE:-true}
      RUSTFS_OBJECT_DATA_CACHE_TTL_SECS: ${RUSTFS_OBJECT_DATA_CACHE_TTL_SECS:-300}

      # RustFS verifies the storage dirs are independent physical disks and
      # refuses to start otherwise. A single named volume (or one host disk split
      # into 4 dirs) always fails that check, so the bypass is required here.
      # Set to `false` only when every RUSTFS_VOLUMES entry is a real, separate
      # physical disk.
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: ${RUSTFS_UNSAFE_BYPASS_DISK_CHECK:-true}
    volumes:
      # - /etc/timezone:/etc/timezone:ro
      # - /etc/localtime:/etc/localtime:ro
      # Image runs as uid/gid 10001 and pre-creates both paths owned by that
      # user, so plain named volumes inherit the right ownership.
      - rustfs_data:/data
      - rustfs_logs:/logs
    # networks:
    #   default: {}
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "curl -f http://127.0.0.1:${PORT_RUSTFS_S3_API:-9000}/health && curl -f http://127.0.0.1:${PORT_RUSTFS_CONSOLE:-9001}/rustfs/console/health",
        ]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3

  ##############################################################################
  ##############################################################################
  ##############################################################################
  postgresql:
    # https://hub.docker.com/_/postgres
    image: postgres:${VERSION_POSTGRESQL:-18.6-alpine}
    # <<: *basic
    deploy:
      # <<: *basic-deploy
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_POSTGRESQL:-1}
          memory: ${RESOURCES_LIMITS_MEMORY_POSTGRESQL:-512m}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_POSTGRESQL:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_POSTGRESQL:-32m}
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_READ_SEARCH
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    secrets:
      - postgres_password_file
    environment:
      # DB_CONNECTION_URI: postgresql://${POSTGRES_USER:-postgresql}:${POSTGRES_PW?POSTGRES_PW is not set}@postgresql:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgresql}
      POSTGRES_DB: ${POSTGRES_DB:-postgresql}
      POSTGRES_USER: ${POSTGRES_USER:-postgresql}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password_file
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      PGDATA: /var/lib/postgresql/18/data
      # POSTGRES_INITDB_ARGS: --data-checksums
      # POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      # - /etc/timezone:/etc/timezone:ro
      # - /etc/localtime:/etc/localtime:ro
      # - type: tmpfs
      #   target: /dev/shm
      #   tmpfs:
      #     size: 134217728 # 128*2^20 bytes = 128Mb
      - postgresql_v18:/var/lib/postgresql/18/data
    # networks:
    #   default: {}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -d $${POSTGRES_DB} -U $${POSTGRES_USER}",
        ]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3

  ##############################################################################
  ##############################################################################
  ##############################################################################
  mariadb:
    # https://hub.docker.com/_/mariadb
    image: mariadb:${VERSION_MARIADB:-13.0.2}
    # <<: *basic
    deploy:
      # <<: *basic-deploy
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_MARIADB:-1}
          memory: ${RESOURCES_LIMITS_MEMORY_MARIADB:-512m}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_MARIADB:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_MARIADB:-32m}
    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    # ports:
    #   - target: ${PORT_MARIADB:-3306}
    #     published: ${PORT_MARIADB_PUBLISH:-3306}
    #     protocol: tcp
    #     # host_ip: 127.0.0.1
    #     mode: host
    secrets:
      - mariadb_root_password
      - mariadb_user_password
    environment:
      TZ: ${TZ:-Europe/Berlin}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-mariadb}
      MARIADB_USER: ${MARIADB_USER:-mariadb}
      MARIADB_PASSWORD_FILE: /run/secrets/mariadb_user_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
      # The image defaults MARIADB_ROOT_HOST to `%`, which creates
      # `root`@`%` with GRANT ALL ... WITH GRANT OPTION -- a live credential
      # for every container on this network. `localhost` leaves only
      # `root`@`localhost`, reachable over the socket via
      # `docker exec mariadb mariadb -uroot`. Drop this ONLY when another
      # service really has to authenticate as root over TCP (zabbix-server,
      # erpnext's bench new-site).
      MARIADB_ROOT_HOST: localhost
      # MARIADB_RANDOM_ROOT_PASSWORD: ${MARIADB_RANDOM_ROOT_PASSWORD:-true}
      # MARIADB_LOG_BIN: ${MARIADB_LOG_BIN:-0}
    volumes:
      # - /etc/timezone:/etc/timezone:ro
      # - /etc/localtime:/etc/localtime:ro
      - mariadb:/var/lib/mysql
    # Binary log is OFF. None of these stacks replicate or do point-in-time
    # recovery, and the binlog is written into the data volume where
    # `binlog_expire_logs_seconds` defaults to 0 (never purge) and purge only
    # runs on rotation -- so an enabled binlog fills /var/lib/mysql no matter
    # which expire setting is used. Turning it on again needs BOTH
    # --max-binlog-size (to force rotation, without which purge never runs)
    # and --binlog-expire-logs-seconds, plus a real root secret to
    # `PURGE BINARY LOGS` by hand.
    command:
      - --skip-log-bin
      - --max-allowed-packet=128M
      - --innodb-log-file-size=128M
    # networks:
    #   default: {}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      # test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh --no-defaults"]
      start_period: 300s
      interval: 30s
      timeout: 5s
      retries: 3

  ##############################################################################
  ## NOTE: for PostgreSQL and MySQL ############################################
  ##############################################################################
  adminer:
    # https://hub.docker.com/_/adminer
    image: adminer:${VERSION_ADMINER:-6.0.1-standalone}
    # <<: *basic
    deploy:
      # <<: *basic-deploy
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_ADMINER:-0.25}
          memory: ${RESOURCES_LIMITS_MEMORY_ADMINER:-256m}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_ADMINER:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_ADMINER:-32m}
    # ports:
    #   - target: ${PORT_ADMINER:-8080}
    #     published: ${PORT_ADMINER_PUBLISH:-8080}
    #     protocol: tcp
    #     # host_ip: 127.0.0.1
    #     mode: host
    environment:
      ADMINER_DEFAULT_SERVER: mysql # mysql | postgresql
      ADMINER_PLUGINS: "tables-filter tinymce file-upload"
      ADMINER_DESIGN: "hydra"
    # volumes:
    #   - /etc/timezone:/etc/timezone:ro
    #   - /etc/localtime:/etc/localtime:ro
    command: php -S 0.0.0.0:8080 -t /var/www/html
    # networks:
    #   default: {}

  ##############################################################################
  ## NOTE: for PostgreSQL and MySQL ############################################
  ## TODO: not complete ready       ############################################
  ##############################################################################
  phpmyadmin:
    # https://hub.docker.com/_/phpmyadmin
    image: phpmyadmin:${VERSION_PHPMYADMIN:-5.2.3-apache}
    # <<: *basic
    deploy:
      # <<: *basic-deploy
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_PHPMYADMIN:-0.25}
          memory: ${RESOURCES_LIMITS_MEMORY_PHPMYADMIN:-256m}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_PHPMYADMIN:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_PHPMYADMIN:-32m}
    # ports:
    #   - target: ${PORT_PHPMYADMIN:-80}
    #     published: ${PORT_PUBLISH_PHPMYADMIN:-80}
    #     protocol: tcp
    #     # host_ip: 127.0.0.1
    #     mode: host
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      UPLOAD_LIMIT: 1G
      APACHE_PORT: 8080
    # volumes:
    #   - /etc/timezone:/etc/timezone:ro
    #   - /etc/localtime:/etc/localtime:ro
    # networks:
    #   default: {}

  ##############################################################################
  ##############################################################################
  ##############################################################################
  influxdb2:
    # https://hub.docker.com/_/influxdb
    image: influxdb:${VERSION_INFLUXDB:-2.9.1-alpine}
    # <<: *basic
    deploy:
      # <<: *basic-deploy
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_INFLUXDB:-1}
          memory: ${RESOURCES_LIMITS_MEMORY_INFLUXDB:-512m}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_INFLUXDB:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_INFLUXDB:-32m}
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
    # ports:
    #   - target: ${PORT_INFLUXDB:-8086}
    #     published: ${PORT_INFLUXDB_PUBLISH:-8086}
    #     protocol: tcp
    #     # host_ip: 127.0.0.1
    #     mode: host
    secrets:
      - influxdb_init_password
    environment:
      DOCKER_INFLUXDB_INIT_MODE: ${DOCKER_INFLUXDB_INIT_MODE:-setup}
      DOCKER_INFLUXDB_INIT_USERNAME: ${DOCKER_INFLUXDB_INIT_USERNAME:-root}
      DOCKER_INFLUXDB_INIT_PASSWORD_FILE: /run/secrets/influxdb_init_password
      DOCKER_INFLUXDB_INIT_ORG: ${DOCKER_INFLUXDB_INIT_ORG:-my_orga}
      DOCKER_INFLUXDB_INIT_BUCKET: ${DOCKER_INFLUXDB_INIT_BUCKET:-db0}
      # DOCKER_INFLUXDB_INIT_RETENTION: ${DOCKER_INFLUXDB_INIT_RETENTION:-1w}
      # DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN:-my-super-secret-auth-token}
    volumes:
      # - /etc/timezone:/etc/timezone:ro
      # - /etc/localtime:/etc/localtime:ro
      - influxdb-storage:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    # networks:
    #   default: {}

  ##############################################################################
  ##############################################################################
  ##############################################################################
  influxdb3:
    # https://hub.docker.com/_/influxdb
    image: influxdb:${VERSION_INFLUXDB3:-3-core}
    # <<: *basic
    deploy:
      # <<: *basic-deploy
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_INFLUXDB3:-1}
          memory: ${RESOURCES_LIMITS_MEMORY_INFLUXDB3:-512m}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_INFLUXDB3:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_INFLUXDB3:-32m}
    # ports:
    #   - target: ${PORT_INFLUXDB3:-8181}
    #     published: ${PORT_INFLUXDB3_PUBLISH:-8181}
    #     protocol: tcp
    #     # host_ip: 127.0.0.1
    #     mode: host
    volumes:
      # - /etc/timezone:/etc/timezone:ro
      # - /etc/localtime:/etc/localtime:ro
      - influxdb3-data:/var/lib/influxdb3/data
      - influxdb3-plugins:/var/lib/influxdb3/plugins
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --plugin-dir=/var/lib/influxdb3/plugins
    # networks:
    #   default: {}

  influxdb3-explorer:
    # https://hub.docker.com/r/influxdata/influxdb3-ui/tags
    # TOKEN: docker exec -it "TODO" influxdb3 create token --admin
    image: influxdata/influxdb3-ui:${VERSION_INFLUXDB3_EXPLORER:-1.8.0}
    # <<: *basic
    deploy:
      # <<: *basic-deploy
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_INFLUXDB3_EXPLORER:-1}
          memory: ${RESOURCES_LIMITS_MEMORY_INFLUXDB3_EXPLORER:-512m}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_INFLUXDB3_EXPLORER:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_INFLUXDB3_EXPLORER:-32m}
    # ports:
    #   - target: ${PORT_INFLUXDB3_EXPLORER:-8080}
    #     published: ${PORT_INFLUXDB3_EXPLORER_PUBLISH:-8080}
    #     protocol: tcp
    #     # host_ip: 127.0.0.1
    #     mode: host
    # volumes:
    #   - /etc/timezone:/etc/timezone:ro
    #   - /etc/localtime:/etc/localtime:ro
    # networks:
    #   default: {}

  ##############################################################################
  ##############################################################################
  ##############################################################################
  # ```sh
  # $docker exec -it "$(docker ps -q -f name=mongodb_mongodb)" mongosh --port 27017 --authenticationDatabase "admin" -u "root" -p
  # ```

  # ```mongodb
  # use graylog
  # db.createUser(
  #   {
  #     user: "graylog",
  #     pwd:  passwordPrompt(),   // or cleartext password
  #     roles: [ { role: "readWrite", db: "graylog" } ]
  #   }
  # )
  # ```
  ##############################################################################
  mongodb:
    # https://hub.docker.com/_/mongo/tags
    image: mongo:${VERSION_MONGODB:-8.3.2}
    # <<: *basic
    deploy:
      # <<: *basic-deploy
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_MONGODB:-1}
          memory: ${RESOURCES_LIMITS_MEMORY_MONGODB:-1g}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_MONGODB:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_MONGODB:-32m}
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_READ_SEARCH
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    # ports:
    #   - target: ${PORT_MONGODB:-27017}
    #     published: ${PORT_MONGODB_PUBLISH:-27017}
    #     protocol: tcp
    #     # host_ip: 127.0.0.1
    #     mode: host
    secrets:
      - mongo_initdb_root_password
    environment:
      TZ: ${TZ:-Europe/Berlin}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_initdb_root_password
    volumes:
      # - /etc/timezone:/etc/timezone:ro
      # - /etc/localtime:/etc/localtime:ro
      - mongodb:/data/db
    # networks:
    #   default: {}

  ##############################################################################
  ## NOTE: for mongoDB              ############################################
  ## TODO: not complete ready       ############################################
  ##############################################################################
  mongo-express:
    # https://hub.docker.com/_/mongo-express/tags
    image: mongo-express:${VERSION_EXPRESS:-1.0.2-20}
    # <<: *basic
    deploy:
      # <<: *basic-deploy
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_EXPRESS:-0.25}
          memory: ${RESOURCES_LIMITS_MEMORY_EXPRESS:-256m}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_EXPRESS:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_EXPRESS:-32m}
    # ports:
    #   - target: ${PORT_EXPRESS:-8081}
    #     published: ${PORT_PUBLISH_EXPRESS:-8081}
    #     protocol: tcp
    #     # host_ip: 127.0.0.1
    #     mode: host
    secrets:
      - me_config_basicauth_password
      - mongo_initdb_root_password
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD_FILE: /run/secrets/me_config_basicauth_password
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD_FILE: /run/secrets/mongo_initdb_root_password
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_OPTIONS_EDITORTHEME: midnight
    # volumes:
    #   - /etc/timezone:/etc/timezone:ro
    #   - /etc/localtime:/etc/localtime:ro
    # networks:
    #   default: {}

  ##############################################################################
  ##############################################################################
  ##############################################################################
  rabbitmq:
    # https://hub.docker.com/_/rabbitmq
    # https://www.rabbitmq.com/docs/upgrade
    # UPGRADE: a node only moves one minor series at a time and refuses to boot
    # when its data dir is more than one series behind (feature flags):
    # 3.13.x -> 4.2.x -> 4.3.x and 4.0.x/4.1.x -> 4.2.x -> 4.3.x. Step through,
    # or drop the data volume -- only in-flight messages are lost, user/vhost
    # are re-seeded from the env below.
    # `-management` adds the management plugin (UI/API 15672); the prometheus
    # plugin (15692) is enabled in the image either way. Drop `-management` when
    # nothing reads the management port.
    image: rabbitmq:${VERSION_RABBITMQ:-4.3.6-management-alpine}
    # <<: *basic
    deploy:
      # <<: *basic-deploy
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_RABBITMQ:-1}
          memory: ${RESOURCES_LIMITS_MEMORY_RABBITMQ:-512m}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_RABBITMQ:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_RABBITMQ:-32m}
    # SETUID/SETGID: `su-exec` in the healthcheck and the entrypoint's step-down
    # to the `rabbitmq` user. CHOWN: the entrypoint chowns foreign-owned files
    # in the data dir and aborts under `cap_drop: ["ALL"]` without it.
    cap_add:
      - SETGID # Allows setting group ID (`setgid`,`newgrp`,`chgrp`,`setregid()`)
      - SETUID # Allows setting user ID (`setuid`,`su`,`sudo`,`passwd`)
      - CHOWN
    # TODO: no `rabbitmq.conf` is mounted, so everything sits at its 4.3
    # default. Ship one via `configs:` (not a bind mount) when tuning is needed:
    #   max_message_size = 536870912            # default 16 MiB, OpenCTI needs 512 MiB
    #   consumer_timeout = 86400000             # default 30 min, long jobs lose their channel
    #   vm_memory_high_watermark.relative = 0.4 # default 0.6 of the cgroup limit
    #   disk_free_limit.absolute = 1GB          # default 50 MB, blocks publishers
    #   loopback_users.guest = true             # image ships 10-defaults.conf
    #                                         # with `loopback_users.guest = false`
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-rabbitmq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS?RABBITMQ_DEFAULT_PASS is not set}
      # `RABBITMQ_DEFAULT_PASS_FILE`/`RABBITMQ_DEFAULT_USER_FILE` are NOT an
      # escape hatch: the 4.x entrypoint hard-exits on them ("deprecated
      # environment variables detected"). A swarm secret can only reach the
      # broker via a definitions import -- not worth it for a task queue.
      # Fixed nodename: the default follows the container hostname, which changes
      # on every swarm task restart and leaves a new mnesia dir behind.
      RABBITMQ_NODENAME: ${RABBITMQ_NODENAME:-rabbit01@localhost}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - rabbitmq_data:/var/lib/rabbitmq
    # The image sets no `USER`, so the probe runs as root, and under
    # `cap_drop: ["ALL"]` root cannot read the 0400 erlang cookie owned by
    # `rabbitmq` -- hence the explicit step-down.
    healthcheck:
      test: ["CMD", "su-exec", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3

