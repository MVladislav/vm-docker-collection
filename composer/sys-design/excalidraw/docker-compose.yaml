---
x-basic-deploy-labels: &app-deploy-labels
  labels:
    - traefik.enable=true
    - traefik.swarm.lbswarm=${LB_SWARM:-true}
    - traefik.swarm.network=proxy
    - traefik.http.routers.excalidraw.entrypoints=${TRAEFIK_ENTRYPOINT:-https}
    - traefik.http.routers.excalidraw.rule=Host(`${DOMAIN?domain variable not set}`)
    - traefik.http.routers.excalidraw.tls=true
    - traefik.http.routers.excalidraw.tls.certresolver=${CERT_RESOLVER:-}
    - traefik.http.routers.excalidraw.middlewares=${MIDDLEWARE_SECURED:-default-secured@file}
    - traefik.http.routers.excalidraw.service=excalidraw
    - traefik.http.services.excalidraw.loadbalancer.server.scheme=${PROTOCOL:-http}
    - traefik.http.services.excalidraw.loadbalancer.server.port=${PORT:-80}

x-storage-deploy-labels: &storage-deploy-labels
  labels:
    - traefik.enable=true
    - traefik.swarm.lbswarm=${LB_SWARM:-true}
    - traefik.swarm.network=proxy
    - traefik.http.routers.excalidraw-storage.entrypoints=${TRAEFIK_ENTRYPOINT:-https}
    - traefik.http.routers.excalidraw-storage.rule=Host(`${DOMAIN?domain variable not set}`) && PathPrefix(`/api/v2`)
    - traefik.http.routers.excalidraw-storage.tls=true
    - traefik.http.routers.excalidraw-storage.tls.certresolver=${CERT_RESOLVER:-}
    - traefik.http.routers.excalidraw-storage.middlewares=${MIDDLEWARE_SECURED:-default-secured@file}
    - traefik.http.routers.excalidraw-storage.service=excalidraw-storage
    - traefik.http.services.excalidraw-storage.loadbalancer.server.scheme=${PROTOCOL_STORAGE:-http}
    - traefik.http.services.excalidraw-storage.loadbalancer.server.port=${PORT_STORAGE:-8080}

x-room-deploy-labels: &room-deploy-labels
  labels:
    - traefik.enable=true
    - traefik.swarm.lbswarm=${LB_SWARM:-true}
    - traefik.swarm.network=proxy
    - traefik.http.routers.excalidraw-room.entrypoints=${TRAEFIK_ENTRYPOINT:-https}
    - traefik.http.routers.excalidraw-room.rule=Host(`${DOMAIN?domain variable not set}`) && PathPrefix(`/socket.io`)
    - traefik.http.routers.excalidraw-room.tls=true
    - traefik.http.routers.excalidraw-room.tls.certresolver=${CERT_RESOLVER:-}
    - traefik.http.routers.excalidraw-room.middlewares=${MIDDLEWARE_SECURED:-default-secured@file}
    - traefik.http.routers.excalidraw-room.service=excalidraw-room
    - traefik.http.services.excalidraw-room.loadbalancer.server.scheme=${PROTOCOL_ROOM:-http}
    - traefik.http.services.excalidraw-room.loadbalancer.server.port=${PORT_ROOM:-8080}

x-basic-deploy: &basic-deploy
  mode: replicated
  replicas: 1
  placement:
    max_replicas_per_node: 1
    constraints:
      - "node.role==${NODE_ROLE:-manager}"
      - node.platform.os == linux
  update_config:
    order: stop-first
  restart_policy:
    condition: any
    delay: 5s
  resources:
    limits:
      cpus: ${RESOURCES_LIMITS_CPUS:-1}
      memory: ${RESOURCES_LIMITS_MEMORY:-500m}
    reservations:
      cpus: ${RESOURCES_RESERVATIONS_CPUS:-0.001}
      memory: ${RESOURCES_RESERVATIONS_MEMORY:-32m}

x-basic: &basic
  env_file: ${ENV_FILE:-.env}
  cap_drop: ["ALL"]
  security_opt:
    - no-new-privileges:true
  ulimits:
    memlock:
      soft: -1
      hard: -1
    nofile:
      soft: 655360
      hard: 655360
    fsize: -1
    as: -1
  # mem_limit: ${RESOURCES_LIMITS_MEMORY:-1g}
  networks:
    default: {}
  healthcheck:
    disable: true
  tmpfs:
    - /tmp:rw,relatime,size=512m,nodev,nosuid,noexec
  restart: always

x-basic-env: &basic-env
  DOMAIN: ${DOMAIN?domain variable not set}

################################################################################
################################################################################
################################################################################
services:
  ##############################################################################
  ##############################################################################
  ##############################################################################
  excalidraw:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        <<: *basic-env
        PUBLIC_PROTOCOL: ${PUBLIC_PROTOCOL:-https}
        VERSION_NODE: ${VERSION_NODE:-22.22.2}
        VERSION_NGINX: ${VERSION_NGINX:-1.31.7-alpine}
        VERSION_EXCALIDRAW: ${VERSION_EXCALIDRAW:-v0.18.1}
        CACHE_INVALIDATOR: ${CACHE_INVALIDATOR:-}
        VITE_APP_AI_BACKEND: ${VITE_APP_AI_BACKEND:-}
        VITE_APP_LIBRARY_URL: ${VITE_APP_LIBRARY_URL:-https://libraries.excalidraw.com}
        VITE_APP_LIBRARY_BACKEND: ${VITE_APP_LIBRARY_BACKEND:-https://us-central1-excalidraw-room-persistence.cloudfunctions.net/libraries}
        VITE_APP_PLUS_LP: ${VITE_APP_PLUS_LP:-}
        VITE_APP_PLUS_APP: ${VITE_APP_PLUS_APP:-}
        VITE_APP_ENABLE_TRACKING: ${VITE_APP_ENABLE_TRACKING:-false}
    image: excalidraw:${VERSION_EXCALIDRAW:-v0.18.1}
    <<:
      - *basic
      - *app-deploy-labels
    deploy:
      <<:
        - *basic-deploy
        - *app-deploy-labels
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      default: {}
      proxy: {}
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:${PORT:-80} || exit 1",
        ]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3

  ##############################################################################
  ##############################################################################
  ##############################################################################
  excalidraw-room:
    build:
      context: .
      dockerfile: ./Dockerfile-room
      args:
        VERSION_NODE: ${VERSION_NODE:-22.22.2}
        VERSION_EXCALIDRAW_ROOM: ${VERSION_EXCALIDRAW_ROOM:-03ff435860b508d7cd9e005cfc90f7977ae2a593}
    image: excalidraw-room:${VERSION_EXCALIDRAW_ROOM:-03ff435860b508d7cd9e005cfc90f7977ae2a593}
    <<:
      - *basic
      - *room-deploy-labels
    deploy:
      <<:
        - *basic-deploy
        - *room-deploy-labels
    environment:
      PORT: ${PORT_ROOM:-8080}
      MAX_HTTP_BUFFER_SIZE: ${MAX_HTTP_BUFFER_SIZE:-5242880}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      default: {}
      proxy: {}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:${PORT_ROOM:-8080}/ || exit 1",
        ]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3

  ##############################################################################
  ##############################################################################
  ##############################################################################
  excalidraw-storage:
    build:
      context: .
      dockerfile: ./Dockerfile-storage
      args:
        VERSION_NODE: ${VERSION_NODE:-22.22.2}
    image: excalidraw-storage:${VERSION_STORAGE:-1.0.0}
    <<:
      - *basic
      - *storage-deploy-labels
    deploy:
      <<:
        - *basic-deploy
        - *storage-deploy-labels
      resources:
        limits:
          cpus: ${RESOURCES_LIMITS_CPUS_STORAGE:-1}
          memory: ${RESOURCES_LIMITS_MEMORY_STORAGE:-1g}
        reservations:
          cpus: ${RESOURCES_RESERVATIONS_CPUS_STORAGE:-0.001}
          memory: ${RESOURCES_RESERVATIONS_MEMORY_STORAGE:-32m}
    environment:
      PORT: ${PORT_STORAGE:-8080}
      GLOBAL_PREFIX: ${GLOBAL_PREFIX_STORAGE:-/api/v2}
      BODY_LIMIT: ${BODY_LIMIT_STORAGE:-50mb}
      LOG_LEVEL: ${LOG_LEVEL_STORAGE:-info}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - storage:/data
    networks:
      default: {}
      proxy: {}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:${PORT_STORAGE:-8080}/health || exit 1",
        ]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3

################################################################################
################################################################################
################################################################################
networks:
  default:
    internal: true
    driver: ${NETWORK_MODE:-overlay} # overlay | bridge
    attachable: true
    driver_opts:
      encrypted: "true"
  proxy:
    external: true

volumes:
  storage: {}
